# セマンティックレイヤー: 相談文の日常語 ⇄ 法律概念 の橋渡し。
# concepts[].indicates_crimes は crimes.yaml の id を指す。
# broader は上位概念(推移的 broaderConcept)。

concepts:
  # --- 身体・生命 ---
  - id: bodily-harm
    pref_label: 身体への侵害
    alt_labels: [怪我, けが, 負傷]
    indicates_crimes: [injury]

  - id: physical-assault
    pref_label: 身体への有形力の行使
    alt_labels: [殴られた, 叩かれた, ボコられた, 蹴られた, 突き飛ばされた, 暴力, 小突かれた, 殴る]
    broader: bodily-harm
    indicates_crimes: [assault, injury]

  - id: killing
    pref_label: 生命の侵害
    alt_labels: [殺された, 殺す, 殺害, 刺された, 命を奪われた, 毒殺]
    indicates_crimes: [homicide, injury-causing-death]

  - id: negligent-death
    pref_label: 過失による死
    alt_labels: [事故で死なせた, うっかり死なせた, 不注意, 過失致死]
    indicates_crimes: [negligent-homicide]

  - id: abandonment-concept
    pref_label: 要扶助者の遺棄
    alt_labels: [置き去り, 見捨てられた, 放置された]
    indicates_crimes: [abandonment]

  # --- 自由 ---
  - id: confinement
    pref_label: 身体活動の自由の侵害
    alt_labels: [監禁, 閉じ込められた, 拘束, 縛られた, 軟禁]
    indicates_crimes: [unlawful-capture-confinement]

  - id: threat-of-harm
    pref_label: 害悪の告知
    alt_labels: [脅された, 殺すと言われた, 脅迫, 危害を加える, 脅し]
    indicates_crimes: [intimidation, compulsion, extortion]

  - id: coercion
    pref_label: 意思に反する強制
    alt_labels: [無理やりやらされた, 強要, 強制, 従わせる, 土下座させられた]
    indicates_crimes: [compulsion]

  - id: kidnapping
    pref_label: 人の略取誘拐
    alt_labels: [誘拐, 連れ去り, 略取, 子供が連れ去られた]
    indicates_crimes: [kidnapping-minor]

  - id: sexual-violence
    pref_label: 性的自由の侵害
    alt_labels: [性的暴行, レイプ, 性被害, 無理やり, 痴漢, 体を触られた]
    indicates_crimes: [non-consensual-sexual-intercourse, non-consensual-indecency]

  - id: intrusion
    pref_label: 住居の平穏の侵害
    alt_labels: [不法侵入, 侵入, 勝手に入られた, 空き巣, 住居侵入]
    indicates_crimes: [breaking-into-residence]

  - id: secret-violation
    pref_label: 秘密の侵害
    alt_labels: [手紙を勝手に開けられた, 信書開封, 郵便を開けられた]
    indicates_crimes: [opening-letters]

  # --- 名誉・信用・業務 ---
  - id: reputation-harm
    pref_label: 名誉の侵害
    alt_labels: [名誉毀損, 悪口, 噂を流された, 誹謗中傷, 晒された, デマ, SNSで悪口]
