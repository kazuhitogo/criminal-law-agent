      - type: conduct
        desc: 行使し、又は電磁的記録を公正証書の原本・人の事務処理の用に供する
        keywords: [行使, 提示, 使った, 見せた]
      - type: intent
        desc: 偽造等であることの認識
        keywords: []
    penalties:
      - type: imprisonment
