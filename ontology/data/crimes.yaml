# 刑法第2編「罪」(77条〜264条) データ
# 法定刑は拘禁刑への一本化(2025年6月施行)を反映。
# statute_text は e-Gov 法令データ(刑法, 明治40年法律第45号)の条文に基づく。
# category は schema.ttl の罪カテゴリクラス名と一致させる。

crimes:
  # ================================================================
  # 【国家的法益に対する罪】
  # ================================================================

  # --- 第2章 内乱に関する罪 (77-80) ---
  - id: insurrection
    label: 内乱罪
    article: "77"
    category: CrimeAgainstStateExistence
    legal_interest: 国家の存立・統治機構
    elements:
      - type: conduct
        desc: 国の統治機構を破壊し又は領土で国権を排除して権力を行使する等を目的とした暴動
        keywords: [内乱, 暴動, クーデター, 政府転覆, 反乱]
      - type: intent
        desc: 国憲紊乱の目的
        keywords: []
    penalties:
      - type: death
        note: 首謀者は死刑又は無期拘禁刑
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: 死刑又は無期拘禁刑(首謀者)。その他は役割に応じ無期又は有期拘禁刑
    statute_text: "国の統治機構を破壊し、又はその領土において国権を排除して権力を行使し、その他憲法の定める統治の基本秩序を壊乱することを目的として暴動をした者は、内乱の罪とし、次の区別に従って処断する。\n一　首謀者は、死刑又は無期拘禁刑に処する。\n二　謀議に参与し、又は群衆を指揮した者は無期又は三年以上の拘禁刑に処し、その他諸般の職務に従事した者は一年以上十年以下の拘禁刑に処する。\n三　付和随行し、その他単に暴動に参加した者は、三年以下の拘禁刑に処する。\n２　前項の罪の未遂は、罰する。ただし、同項第三号に規定する者については、この限りでない。"

  - id: insurrection-preparation
    label: 内乱予備・陰謀罪
    article: "78"
    category: CrimeAgainstStateExistence
    legal_interest: 国家の存立・統治機構
    elements:
      - type: conduct
        desc: 内乱の予備（武器・資金の準備等）又は陰謀（二人以上での謀議）をする
        keywords: [内乱の準備, 内乱の計画, クーデター計画, 謀議]
      - type: intent
        desc: 内乱を実行する目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 1
        max: 10
        unit: year
        note: 1年以上10年以下の拘禁刑
    statute_text: "内乱の予備又は陰謀をした者は、一年以上十年以下の拘禁刑に処する。"
    related_to: [insurrection]

  - id: aiding-insurrection
    label: 内乱等幇助罪
    article: "79"
    category: CrimeAgainstStateExistence
    legal_interest: 国家の存立・統治機構
    elements:
      - type: conduct
        desc: 兵器・資金・食糧の供給その他の行為により、内乱又は内乱の予備・陰謀を幇助する
        keywords: [兵器を供給, 資金を提供, 食糧を供給, 幇助]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 7
        unit: year
        note: 7年以下の拘禁刑
    statute_text: "兵器、資金若しくは食糧を供給し、又はその他の行為により、前二条の罪を幇助した者は、七年以下の拘禁刑に処する。"
    related_to: [insurrection, insurrection-preparation]

  # --- 第3章 外患に関する罪 (81-89) ---
  - id: inducement-foreign-aggression
    label: 外患誘致罪
    article: "81"
    category: CrimeAgainstStateExistence
    legal_interest: 国家の対外的存立
    elements:
      - type: conduct
        desc: 外国と通謀して日本国に武力を行使させる
        keywords: [外患, 外国と通謀, 武力行使, 売国]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: death
        note: 死刑
    statute_text: "外国と通謀して日本国に対し武力を行使させた者は、死刑に処する。"

  - id: assisting-foreign-aggression
    label: 外患援助罪
    article: "82"
    category: CrimeAgainstStateExistence
    legal_interest: 国家の対外的存立
    elements:
      - type: circumstance
        desc: 日本国に対して外国から武力の行使があったとき
        keywords: [武力行使, 侵攻, 戦争]
      - type: conduct
        desc: 外国に加担して軍務に服し、その他外国に軍事上の利益を与える
        keywords: [外国軍に加担, 軍事情報を渡す, 敵に協力]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: death
        note: 死刑又は無期若しくは2年以上の拘禁刑
      - type: imprisonment
        min: 2
        max: null
        unit: year
        note: 死刑又は無期若しくは2年以上の拘禁刑
    statute_text: "日本国に対して外国から武力の行使があったときに、これに加担して、その軍務に服し、その他これに軍事上の利益を与えた者は、死刑又は無期若しくは二年以上の拘禁刑に処する。"
    related_to: [inducement-foreign-aggression]

  - id: foreign-aggression-preparation
    label: 外患予備・陰謀罪
    article: "88"
    category: CrimeAgainstStateExistence
    legal_interest: 国家の対外的存立
    elements:
      - type: conduct
        desc: 外患誘致罪（81条）又は外患援助罪（82条）の予備又は陰謀をする
        keywords: [外患の準備, 外国と密約, 謀議]
      - type: intent
        desc: 外患誘致・外患援助を実行する目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 1
        max: 10
        unit: year
        note: 1年以上10年以下の拘禁刑
    statute_text: "第八十一条又は第八十二条の罪の予備又は陰謀をした者は、一年以上十年以下の拘禁刑に処する。"
    related_to: [inducement-foreign-aggression, assisting-foreign-aggression]

  # --- 第4章 国交に関する罪 (90-94) ---
  - id: damaging-foreign-national-emblem
    label: 外国国章損壊等罪
    article: "92"
    category: CrimeAgainstStateExistence
    legal_interest: 日本国の外交上の利益
    elements:
      - type: object
        desc: 外国の国旗その他の国章
        keywords: [外国の国旗, 国旗, 国章]
      - type: conduct
        desc: 損壊し、除去し、又は汚損する
        keywords: [燃やす, 破る, 引きずり下ろす, 汚す]
      - type: intent
        desc: 外国に対して侮辱を加える目的
        keywords: []
      - type: circumstance
        desc: （2項）外国政府の請求がなければ公訴を提起できない
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
      - type: fine
        max: 200000
        unit: yen
        note: 20万円以下の罰金
    statute_text: "外国に対して侮辱を加える目的で、その国の国旗その他の国章を損壊し、除去し、又は汚損した者は、二年以下の拘禁刑又は二十万円以下の罰金に処する。\n２　前項の罪は、外国政府の請求がなければ公訴を提起することができない。"

  - id: private-war-preparation
    label: 私戦予備・陰謀罪
    article: "93"
    category: CrimeAgainstStateExistence
    legal_interest: 日本国の外交上の利益
    elements:
      - type: conduct
        desc: 外国に対して私的に戦闘行為をするための予備又は陰謀をする（自首した者は刑を免除）
        keywords: [私戦, 外国で戦闘, 義勇兵, 武器の準備]
      - type: intent
        desc: 外国に対して私的に戦闘行為をする目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: 3月以上5年以下の拘禁刑（自首した者は刑を免除）
    statute_text: "外国に対して私的に戦闘行為をする目的で、その予備又は陰謀をした者は、三月以上五年以下の拘禁刑に処する。ただし、自首した者は、その刑を免除する。"

  - id: violation-of-neutrality-order
    label: 中立命令違反罪
    article: "94"
    category: CrimeAgainstStateExistence
    legal_interest: 日本国の外交上の利益
    elements:
      - type: circumstance
        desc: 外国が交戦している際
        keywords: [交戦, 戦争]
      - type: conduct
        desc: 局外中立に関する命令に違反する
        keywords: [中立命令, 局外中立]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "外国が交戦している際に、局外中立に関する命令に違反した者は、三年以下の拘禁刑又は五十万円以下の罰金に処する。"

  # --- 第5章 公務の執行を妨害する罪 (95-96の6) ---
  - id: obstruction-of-official-duty
    label: 公務執行妨害罪
    article: "95"
    category: CrimeAgainstStateFunction
    legal_interest: 国家・地方公共団体の公務
    elements:
      - type: object
        desc: 職務を執行する公務員
        keywords: [警察官, 公務員, 職員, 役所]
      - type: conduct
        desc: 職務執行に際し暴行又は脅迫を加える
        keywords: [暴行, 脅迫, 抵抗, 妨害, 殴る, 突き飛ばす]
      - type: conduct
        desc: （2項・職務強要）公務員に処分をさせ若しくはさせないため、又は辞職させるために暴行又は脅迫を加える
        keywords: [職務強要, 辞職を迫る, 処分を迫る]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "公務員が職務を執行するに当たり、これに対して暴行又は脅迫を加えた者は、三年以下の拘禁刑又は五十万円以下の罰金に処する。\n２　公務員に、ある処分をさせ、若しくはさせないため、又はその職を辞させるために、暴行又は脅迫を加えた者も、前項と同様とする。"

  - id: computer-obstruction-of-official-duty
    label: 電子計算機損壊等公務執行妨害罪
    article: "95の2"
    category: CrimeAgainstStateFunction
    legal_interest: 国家・地方公共団体の公務
    elements:
      - type: circumstance
        desc: 公務員が職務を執行するに当たり
        keywords: [公務員, 役所]
      - type: object
        desc: 公務員の職務に使用する電子計算機又はその用に供する電磁的記録
        keywords: [役所のパソコン, 行政システム, 電子計算機, 電磁的記録]
      - type: conduct
        desc: 損壊し、虚偽の情報・不正な指令を与え、その他の方法により、使用目的に沿う動作をさせず又は反する動作をさせる
        keywords: [システムを壊す, データを消す, ウイルス, 不正な指令]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "公務員が職務を執行するに当たり、その職務に使用する電子計算機若しくはその用に供する電磁的記録を損壊し、若しくはその職務に使用する電子計算機に虚偽の情報若しくは不正な指令を与え、又はその他の方法により、その電子計算機に使用目的に沿うべき動作をさせず、又は使用目的に反する動作をさせた者は、三年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [obstruction-of-official-duty]

  - id: breaking-seals
    label: 封印等破棄罪
    article: "96"
    category: CrimeAgainstStateFunction
    legal_interest: 公務員が施した封印・差押えの表示の効力（強制執行等の公務）
    elements:
      - type: object
        desc: 公務員が施した封印又は差押えの表示
        keywords: [封印, 差押えの表示, 差し押さえの紙]
      - type: conduct
        desc: 損壊し、又はその他の方法により封印・差押えの表示に係る命令・処分を無効にする
        keywords: [剥がす, 破る, 持ち出す]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑若しくは250万円以下の罰金に処し、又はこれを併科する
      - type: fine
        max: 2500000
        unit: yen
        note: 250万円以下の罰金（拘禁刑との任意的併科あり）
    statute_text: "公務員が施した封印若しくは差押えの表示を損壊し、又はその他の方法によりその封印若しくは差押えの表示に係る命令若しくは処分を無効にした者は、三年以下の拘禁刑若しくは二百五十万円以下の罰金に処し、又はこれを併科する。"

  - id: property-damage-to-obstruct-execution
    label: 強制執行妨害目的財産損壊等罪
    article: "96の2"
    category: CrimeAgainstStateFunction
    legal_interest: 強制執行の適正な運用
    elements:
      - type: object
        desc: 強制執行を受け、若しくは受けるべき財産（3号は金銭執行を受けるべき財産）
        keywords: [差押え, 財産, 資産]
      - type: conduct
        desc: （1号）財産を隠匿・損壊し、譲渡を仮装し、又は債務の負担を仮装する
        keywords: [財産を隠す, 資産隠し, 仮装譲渡, 名義を移す, 架空の借金]
      - type: conduct
        desc: （2号）財産の現状を改変して価格を減損し、又は強制執行の費用を増大させる
        keywords: [価値を下げる, 現状を変える]
      - type: conduct
        desc: （3号）金銭執行を受けるべき財産を無償その他の不利益な条件で譲渡し、又は権利を設定する。情を知ってその相手方となった者も同様
        keywords: [タダで譲る, 安く譲る, 譲渡]
      - type: intent
        desc: 強制執行を妨害する目的
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑若しくは250万円以下の罰金に処し、又はこれを併科する
      - type: fine
        max: 2500000
        unit: yen
        note: 250万円以下の罰金（拘禁刑との任意的併科あり）
    statute_text: "強制執行を妨害する目的で、次の各号のいずれかに該当する行為をした者は、三年以下の拘禁刑若しくは二百五十万円以下の罰金に処し、又はこれを併科する。情を知って、第三号に規定する譲渡又は権利の設定の相手方となった者も、同様とする。\n一　強制執行を受け、若しくは受けるべき財産を隠匿し、損壊し、若しくはその譲渡を仮装し、又は債務の負担を仮装する行為\n二　強制執行を受け、又は受けるべき財産について、その現状を改変して、価格を減損し、又は強制執行の費用を増大させる行為\n三　金銭執行を受けるべき財産について、無償その他の不利益な条件で、譲渡をし、又は権利の設定をする行為"

  - id: obstruction-of-compulsory-execution
    label: 強制執行行為妨害等罪
    article: "96の3"
    category: CrimeAgainstStateFunction
    legal_interest: 強制執行の適正な運用
    elements:
      - type: conduct
        desc: 偽計又は威力を用いて、立入り・占有者の確認その他の強制執行の行為を妨害する
        keywords: [執行官を妨害, 立入りを拒む, 居座る, 偽計, 威力]
      - type: conduct
        desc: （2項）強制執行の申立てをさせず又は取り下げさせる目的で、申立権者又はその代理人に暴行又は脅迫を加える
        keywords: [申立てを取り下げろ, 債権者を脅す]
      - type: intent
        desc: 故意（2項は申立てをさせない・取り下げさせる目的）
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑若しくは250万円以下の罰金に処し、又はこれを併科する
      - type: fine
        max: 2500000
        unit: yen
        note: 250万円以下の罰金（拘禁刑との任意的併科あり）
    statute_text: "偽計又は威力を用いて、立入り、占有者の確認その他の強制執行の行為を妨害した者は、三年以下の拘禁刑若しくは二百五十万円以下の罰金に処し、又はこれを併科する。\n２　強制執行の申立てをさせず又はその申立てを取り下げさせる目的で、申立権者又はその代理人に対して暴行又は脅迫を加えた者も、前項と同様とする。"

  - id: obstruction-of-execution-sale
    label: 強制執行関係売却妨害罪
    article: "96の4"
    category: CrimeAgainstStateFunction
    legal_interest: 強制執行における売却の公正
    elements:
      - type: object
        desc: 強制執行において行われ、又は行われるべき売却（競売等）
        keywords: [競売, 売却]
      - type: conduct
        desc: 偽計又は威力を用いて売却の公正を害すべき行為をする
        keywords: [競売妨害, 入札を妨害, 買受けを妨害]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑若しくは250万円以下の罰金に処し、又はこれを併科する
      - type: fine
        max: 2500000
        unit: yen
        note: 250万円以下の罰金（拘禁刑との任意的併科あり）
    statute_text: "偽計又は威力を用いて、強制執行において行われ、又は行われるべき売却の公正を害すべき行為をした者は、三年以下の拘禁刑若しくは二百五十万円以下の罰金に処し、又はこれを併科する。"

  - id: aggravated-breaking-seals
    label: 加重封印等破棄等罪
    article: "96の5"
    category: CrimeAgainstStateFunction
    legal_interest: 強制執行の適正な運用
    elements:
      - type: conduct
        desc: 人の債務に関して、96条から96条の4までの罪を犯す
        keywords: [他人の借金, 執行妨害の請負, 占有屋]
      - type: intent
        desc: 報酬を得、又は得させる目的
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑若しくは500万円以下の罰金に処し、又はこれを併科する
      - type: fine
        max: 5000000
        unit: yen
        note: 500万円以下の罰金（拘禁刑との任意的併科あり）
    statute_text: "報酬を得、又は得させる目的で、人の債務に関して、第九十六条から前条までの罪を犯した者は、五年以下の拘禁刑若しくは五百万円以下の罰金に処し、又はこれを併科する。"
    related_to: [breaking-seals, property-damage-to-obstruct-execution, obstruction-of-compulsory-execution, obstruction-of-execution-sale]

  - id: obstruction-of-public-auction
    label: 公契約関係競売等妨害罪
    article: "96の6"
    category: CrimeAgainstStateFunction
    legal_interest: 公の競売・入札の公正
    elements:
      - type: object
        desc: 公の競売又は入札で契約を締結するためのもの
        keywords: [公共工事, 入札, 公の競売]
      - type: conduct
        desc: 偽計又は威力を用いて、公の競売・入札の公正を害すべき行為をする
        keywords: [入札妨害, 予定価格を漏らす, 官製談合]
      - type: conduct
        desc: （2項・談合）談合する
        keywords: [談合, 入札談合]
      - type: intent
        desc: 故意（2項は公正な価格を害し又は不正な利益を得る目的）
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑若しくは250万円以下の罰金に処し、又はこれを併科する
      - type: fine
        max: 2500000
        unit: yen
        note: 250万円以下の罰金（拘禁刑との任意的併科あり）
    statute_text: "偽計又は威力を用いて、公の競売又は入札で契約を締結するためのものの公正を害すべき行為をした者は、三年以下の拘禁刑若しくは二百五十万円以下の罰金に処し、又はこれを併科する。\n２　公正な価格を害し又は不正な利益を得る目的で、談合した者も、前項と同様とする。"

  # --- 第6章 逃走の罪 (97-102) ---
  - id: escape
    label: 逃走罪
    article: "97"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の拘禁作用
    elements:
      - type: object
        desc: 法令により拘禁された者
        keywords: [逃走, 脱走, 脱獄, 逃げる]
      - type: conduct
        desc: 逃走する
        keywords: [逃走, 逃亡]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
    statute_text: "法令により拘禁された者が逃走したときは、三年以下の拘禁刑に処する。"

  - id: aggravated-escape
    label: 加重逃走罪
    article: "98"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の拘禁作用
    elements:
      - type: object
        desc: 法令により拘禁された者
        keywords: [拘禁, 留置場, 刑務所]
      - type: conduct
        desc: 拘禁場若しくは拘束のための器具を損壊し、暴行若しくは脅迫をし、又は二人以上通謀して逃走する
        keywords: [手錠を壊す, 檻を壊す, 看守を殴る, 集団脱走, 脱獄]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: 3月以上5年以下の拘禁刑
    statute_text: "前条に規定する者が拘禁場若しくは拘束のための器具を損壊し、暴行若しくは脅迫をし、又は二人以上通謀して、逃走したときは、三月以上五年以下の拘禁刑に処する。"
    related_to: [escape]

  - id: rescuing-prisoner
    label: 被拘禁者奪取罪
    article: "99"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の拘禁作用
    elements:
      - type: object
        desc: 法令により拘禁された者
        keywords: [逮捕された人, 囚人, 被疑者]
      - type: conduct
        desc: 奪取する（看守者の実力支配から離脱させ、自己又は第三者の支配下に移す）
        keywords: [奪還, 奪い返す, 連れ去る]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: 3月以上5年以下の拘禁刑
    statute_text: "法令により拘禁された者を奪取した者は、三月以上五年以下の拘禁刑に処する。"

  - id: aiding-escape
    label: 逃走援助罪
    article: "100"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の拘禁作用
    elements:
      - type: conduct
        desc: 器具を提供し、その他逃走を容易にすべき行為をする
        keywords: [脱獄を手伝う, 逃走を手伝う, 道具を差し入れる]
      - type: conduct
        desc: （2項）逃走させる目的で暴行又は脅迫をする
        keywords: [看守を脅す, 暴行]
      - type: intent
        desc: 法令により拘禁された者を逃走させる目的
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑（1項）
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: 3月以上5年以下の拘禁刑（2項）
    statute_text: "法令により拘禁された者を逃走させる目的で、器具を提供し、その他逃走を容易にすべき行為をした者は、三年以下の拘禁刑に処する。\n２　前項の目的で、暴行又は脅迫をした者は、三月以上五年以下の拘禁刑に処する。"
    related_to: [escape]

  - id: aiding-escape-by-guard
    label: 看守者等逃走援助罪
    article: "101"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の拘禁作用
    elements:
      - type: object
        desc: 法令により拘禁された者を看守し又は護送する者（身分犯）
        keywords: [看守, 刑務官, 護送]
      - type: conduct
        desc: 拘禁された者を逃走させる
        keywords: [逃がす, 逃走させる]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 1
        max: 10
        unit: year
        note: 1年以上10年以下の拘禁刑
    statute_text: "法令により拘禁された者を看守し又は護送する者がその拘禁された者を逃走させたときは、一年以上十年以下の拘禁刑に処する。"
    related_to: [aiding-escape]

  # --- 第7章 犯人蔵匿及び証拠隠滅の罪 (103-105の2) ---
  - id: harboring-criminal
    label: 犯人蔵匿罪
    article: "103"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の刑事司法作用
    elements:
      - type: object
        desc: 罰金以上の刑に当たる罪を犯した者又は拘禁中に逃走した者
        keywords: [犯人, かくまう, 匿う, 逃がす]
      - type: conduct
        desc: 蔵匿し又は隠避させる
        keywords: [かくまう, 匿う, 隠す, 逃がす]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金
    statute_text: "罰金以上の刑に当たる罪を犯した者又は拘禁中に逃走した者を蔵匿し、又は隠避させた者は、三年以下の拘禁刑又は三十万円以下の罰金に処する。"

  - id: evidence-destruction
    label: 証拠隠滅罪
    article: "104"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の刑事司法作用
    elements:
      - type: object
        desc: 他人の刑事事件に関する証拠
        keywords: [証拠, 隠滅, 偽造, 変造, 隠す, 捨てる]
      - type: conduct
        desc: 隠滅・偽造・変造し又はこれを使用する
        keywords: [隠滅, 証拠隠滅, 偽造, 変造]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金
    statute_text: "他人の刑事事件に関する証拠を隠滅し、偽造し、若しくは変造し、又は偽造若しくは変造の証拠を使用した者は、三年以下の拘禁刑又は三十万円以下の罰金に処する。"

  - id: intimidation-of-witness
    label: 証人等威迫罪
    article: "105の2"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の刑事司法作用・証人等の私生活の平穏
    elements:
      - type: object
        desc: 自己若しくは他人の刑事事件の捜査・審判に必要な知識を有すると認められる者（被害者・証人・参考人等）又はその親族
        keywords: [証人, 被害者, 目撃者, 参考人]
      - type: conduct
        desc: 当該事件に関して、正当な理由なく面会を強請し、又は強談威迫の行為をする
        keywords: [証言するな, 被害届を取り下げろ, 口止め, 押しかける, 示談を迫る]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金
    statute_text: "自己若しくは他人の刑事事件の捜査若しくは審判に必要な知識を有すると認められる者又はその親族に対し、当該事件に関して、正当な理由がないのに面会を強請し、又は強談威迫の行為をした者は、二年以下の拘禁刑又は三十万円以下の罰金に処する。"
    related_to: [evidence-destruction, intimidation]

  # --- 第8章 騒乱の罪 (106-107) ---
  - id: riot
    label: 騒乱罪
    article: "106"
    category: CrimeAgainstPublicSafety
    legal_interest: 公共の平穏
    elements:
      - type: conduct
        desc: 多衆で集合して暴行又は脅迫をする
        keywords: [騒乱, 暴動, 多衆, 集団, 暴れる]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 1
        max: 10
        unit: year
        note: 首謀者は1年以上10年以下の拘禁刑
      - type: imprisonment
        min: 6
        max: 84
        unit: month
        note: 他人を指揮し又は率先して勢いを助けた者は6月以上7年以下の拘禁刑
      - type: fine
        max: 100000
        unit: yen
        note: 付和随行した者は10万円以下の罰金
    statute_text: "多衆で集合して暴行又は脅迫をした者は、騒乱の罪とし、次の区別に従って処断する。\n一　首謀者は、一年以上十年以下の拘禁刑に処する。\n二　他人を指揮し、又は他人に率先して勢いを助けた者は、六月以上七年以下の拘禁刑に処する。\n三　付和随行した者は、十万円以下の罰金に処する。"

  # --- 第9章 放火及び失火の罪 (108-118) ---
  - id: arson-inhabited
    label: 現住建造物等放火罪
    article: "108"
    category: CrimeAgainstPublicSafety
    legal_interest: 公共の安全(不特定多数の生命身体財産)
    elements:
      - type: object
        desc: 現に人が住居に使用し又は現に人がいる建造物等
        keywords: [放火, 火をつける, 燃やす, 家, 建物]
      - type: conduct
        desc: 放火して焼損する
        keywords: [放火, 火災, 燃やす, 火をつける]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: death
        note: 死刑又は無期若しくは5年以上の拘禁刑
      - type: imprisonment
        min: 5
        max: null
        unit: year
        note: 死刑又は無期若しくは5年以上の拘禁刑
    statute_text: "放火して、現に人が住居に使用し又は現に人がいる建造物、汽車、電車、艦船又は鉱坑を焼損した者は、死刑又は無期若しくは五年以上の拘禁刑に処する。"

  # --- 第15章 飲料水に関する罪 (142-147) ---
  - id: water-contamination
    label: 浄水汚染罪
    article: "142"
    category: CrimeAgainstPublicMorals
    legal_interest: 公衆の健康
    elements:
      - type: object
        desc: 人の飲料に供する浄水
        keywords: [飲料水, 水道, 汚染, 毒, 混入]
      - type: conduct
        desc: 汚染して使用できないようにする
        keywords: [汚染, 混入, 毒, 汚す]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 6
        unit: month
        note: 6月以下の拘禁刑
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金
    statute_text: "人の飲料に供する浄水を汚染し、よって使用することができないようにした者は、六月以下の拘禁刑又は十万円以下の罰金に処する。"

  # --- 第16章 通貨偽造の罪 (148-153) ---
  - id: counterfeiting-currency
    label: 通貨偽造罪
    article: "148"
    category: CrimeAgainstPublicTrust
    legal_interest: 通貨に対する公共の信用
    elements:
      - type: object
        desc: 行使の目的で通用する貨幣・紙幣・銀行券
        keywords: [偽札, 偽造, 通貨, お金, 紙幣, 貨幣]
      - type: conduct
        desc: 偽造又は変造する
        keywords: [偽造, 変造, 偽札]
      - type: conduct
        desc: （2項）偽造・変造の通貨を行使し、又は行使の目的で人に交付し若しくは輸入する
        keywords: [偽札を使う, 行使, 交付, 輸入]
      - type: intent
        desc: 行使の目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: null
        unit: year
        note: 無期又は3年以上の拘禁刑
    statute_text: "行使の目的で、通用する貨幣、紙幣又は銀行券を偽造し、又は変造した者は、無期又は三年以上の拘禁刑に処する。\n２　偽造又は変造の貨幣、紙幣又は銀行券を行使し、又は行使の目的で人に交付し、若しくは輸入した者も、前項と同様とする。"

  # --- 第17章 文書偽造の罪 (154-161の2) ---
  - id: counterfeiting-private-document
    label: 私文書偽造罪
    article: "159"
    category: CrimeAgainstPublicTrust
    legal_interest: 文書に対する公共の信用
    elements:
      - type: object
        desc: 権利義務又は事実証明に関する他人の文書等・電磁的記録文書等
        keywords: [文書偽造, 偽造, 書類, 契約書, サイン, 署名, 印鑑]
      - type: conduct
        desc: （1項）他人の印章等・電磁的記録印章等を使用して偽造する
        keywords: [偽造, なりすまし, 偽の書類]
      - type: conduct
        desc: （2項）他人が押印・署名した文書等又は電磁的記録文書等を変造する
        keywords: [変造, 改ざん]
      - type: conduct
        desc: （3項）前二項以外の権利義務又は事実証明に関する文書等・電磁的記録文書等を偽造・変造する（無印私文書偽造等）
        keywords: [偽造, 変造]
      - type: intent
        desc: 行使の目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: 3月以上5年以下の拘禁刑（1項・2項）
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑（3項）
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金（3項）
    statute_text: "行使の目的で、次の各号に掲げるいずれかの行為をした者は、三月以上五年以下の拘禁刑に処する。\n一　他人の印章等を使用して権利、義務若しくは事実証明に関する文書等を偽造し、又は偽造した他人の印章等を使用して権利、義務若しくは事実証明に関する文書等を偽造する行為\n二　他人の電磁的記録印章等を使用して権利、義務若しくは事実証明に関する電磁的記録文書等を偽造し、又は偽造した他人の電磁的記録印章等を使用して権利、義務若しくは事実証明に関する電磁的記録文書等を偽造する行為\n２　他人が押印し若しくは署名した権利、義務若しくは事実証明に関する文書等又は他人が電磁的記録印章等を使用して作成した権利、義務若しくは事実証明に関する電磁的記録文書等を変造した者も、前項と同様とする。\n３　前二項に規定するもののほか、権利、義務又は事実証明に関する文書等又は電磁的記録文書等を偽造し、又は変造した者は、一年以下の拘禁刑又は十万円以下の罰金に処する。"

  # --- 第18章 有価証券偽造の罪 (162-163) ---
  - id: counterfeiting-securities
    label: 有価証券偽造罪
    article: "162"
    category: CrimeAgainstPublicTrust
    legal_interest: 有価証券に対する公共の信用
    elements:
      - type: object
        desc: 公債証書・官庁の証券・会社の株券その他の有価証券
        keywords: [有価証券, 株券, 手形, 小切手, 偽造]
      - type: conduct
        desc: 偽造又は変造する
        keywords: [偽造, 変造]
      - type: conduct
        desc: （2項）有価証券に虚偽の記入をする
        keywords: [虚偽記入]
      - type: intent
        desc: 行使の目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 120
        unit: month
        note: 3月以上10年以下の拘禁刑
    statute_text: "行使の目的で、公債証書、官庁の証券、会社の株券その他の有価証券を偽造し、又は変造した者は、三月以上十年以下の拘禁刑に処する。\n２　行使の目的で、有価証券に虚偽の記入をした者も、前項と同様とする。"

  # --- 第18章の2 支払用カード電磁的記録に関する罪 (163の2-163の5) ---
  - id: unauthorized-payment-card-record
    label: 支払用カード電磁的記録不正作出罪
    article: "163の2"
    category: CrimeAgainstPublicTrust
    legal_interest: 支払用カードの電磁的記録に対する信用
    elements:
      - type: object
        desc: 人の財産上の事務処理を誤らせる目的のクレジットカード等の電磁的記録
        keywords: [クレジットカード, スキミング, 電磁的記録, カード偽造, 不正作出]
      - type: conduct
        desc: 不正に作出する（預貯金の引出用カードの電磁的記録を含む）
        keywords: [偽造, スキミング, 不正作出]
      - type: conduct
        desc: （2項）不正に作られた電磁的記録を人の財産上の事務処理の用に供する
        keywords: [偽造カードを使う, 不正使用]
      - type: conduct
        desc: （3項）不正に作られた電磁的記録を構成部分とするカードを譲り渡し・貸し渡し・輸入する
        keywords: [譲渡, 貸与, 輸入]
      - type: intent
        desc: 財産上の事務処理を誤らせる目的
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
      - type: fine
        max: 1000000
        unit: yen
        note: 100万円以下の罰金
    statute_text: "人の財産上の事務処理を誤らせる目的で、その事務処理の用に供する電磁的記録であって、クレジットカードその他の代金又は料金の支払用のカードを構成するものを不正に作った者は、十年以下の拘禁刑又は百万円以下の罰金に処する。預貯金の引出用のカードを構成する電磁的記録を不正に作った者も、同様とする。\n２　不正に作られた前項の電磁的記録を、同項の目的で、人の財産上の事務処理の用に供した者も、同項と同様とする。\n３　不正に作られた第一項の電磁的記録をその構成部分とするカードを、同項の目的で、譲り渡し、貸し渡し、又は輸入した者も、同項と同様とする。"

