      - type: conduct
        desc: 任務に背く行為で本人に財産上の損害を加える
        keywords: [背任, 任務違反, 損害]
      - type: intent
        desc: 図利加害目的
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "他人のためにその事務を処理する者が、自己若しくは第三者の利益を図り又は本人に損害を加える目的で、その任務に背く行為をし、本人に財産上の損害を加えたときは、五年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [embezzlement]

  # --- 第39章 盗品等に関する罪 (256) ---
  - id: stolen-property
    label: 盗品等関与罪
    article: "256"
    category: CrimeAgainstProperty
    legal_interest: 被害者の追求権・財産
    elements:
      - type: object
        desc: 盗品その他財産に対する罪に当たる行為で領得された物
        keywords: [盗品, 故買, 贓物, 盗まれた物の取引]
      - type: conduct
        desc: 無償譲受・運搬・保管・有償譲受・あっせんをする
        keywords: [盗品, 譲受, 故買]
      - type: intent
        desc: 盗品であることの認識
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑(有償譲受け等)
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金(有償譲受け等)
    statute_text: "盗品その他財産に対する罪に当たる行為によって領得された物を運搬し、保管し、若しくは有償で譲り受け、又はその有償の処分のあっせんをした者は、十年以下の拘禁刑及び五十万円以下の罰金に処する。"

  # --- 第40章 毀棄及び隠匿の罪 (258-264) ---
  - id: property-damage
    label: 器物損壊罪
    article: "261"
    category: CrimeAgainstProperty
    legal_interest: 財産(物の効用)
    elements:
      - type: object
        desc: 他人の物(公用・私用文書等を除く)
        keywords: [器物損壊, 壊された, 壊す, 破損, 傷つけられた, 落書き, 割られた]
      - type: conduct
        desc: 損壊又は傷害する
        keywords: [壊す, 破壊, 損壊, 傷つける, 割る]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金又は科料
    statute_text: "前三条に規定するもののほか、他人の物を損壊し、又は傷害した者は、三年以下の拘禁刑又は三十万円以下の罰金若しくは科料に処する。"

  # --- 第12章 住居を侵す罪 (130-132) ---
  - id: breaking-into-residence
    label: 住居侵入罪
    article: "130"
    category: CrimeAgainstFreedomHonor
    legal_interest: 住居の平穏・管理権
    elements:
      - type: object
        desc: 人の住居・邸宅・建造物・艦船
        keywords: [住居侵入, 不法侵入, 侵入, 勝手に入られた, 空き巣, 侵入された]
      - type: conduct
        desc: 正当な理由なく侵入し又は要求を受けて退去しない
        keywords: [侵入, 勝手に入る, 不法侵入, 退去しない]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金
    statute_text: "正当な理由がないのに、人の住居若しくは人の看守する邸宅、建造物若しくは艦船に侵入し、又は要求を受けたにもかかわらずこれらの場所から退去しなかった者は、三年以下の拘禁刑又は十万円以下の罰金に処する。"

  # --- 第13章 秘密を侵す罪 (133-135) ---
  - id: opening-letters
    label: 信書開封罪
    article: "133"
    category: CrimeAgainstFreedomHonor
    legal_interest: 個人の秘密・通信の秘密
    elements:
      - type: object
        desc: 封をしてある他人の信書
        keywords: [信書開封, 手紙を勝手に開けられた, 郵便, 開封]
      - type: conduct
        desc: 正当な理由なく開封する
        keywords: [開封, 勝手に開ける]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑
      - type: fine
        max: 200000
        unit: yen
        note: 20万円以下の罰金
    statute_text: "正当な理由がないのに、封をしてある信書を開けた者は、一年以下の拘禁刑又は二十万円以下の罰金に処する。"

  # --- 第10章 往来を妨害する罪 (124-129) ---
  - id: obstruction-of-traffic
    label: 往来妨害罪
    article: "124"
    category: CrimeAgainstPublicSafety
    legal_interest: 交通の安全
    elements:
      - type: object
        desc: 陸路・水路・橋
        keywords: [往来妨害, 道路封鎖, 通行妨害, 交通妨害]
      - type: conduct
        desc: 損壊又は閉塞して往来の妨害を生じさせる
        keywords: [妨害, 封鎖, 閉塞]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
      - type: fine
        max: 200000
        unit: yen
        note: 20万円以下の罰金
    statute_text: "陸路、水路又は橋を損壊し、又は閉塞して往来の妨害を生じさせた者は、二年以下の拘禁刑又は二十万円以下の罰金に処する。"
