    elements:
      - type: conduct
        desc: （1項）公務員が収賄・受託収賄・事前収賄・第三者供賄の罪を犯し、よって不正な行為をし又は相当の行為をしない
        keywords: [便宜を図る, 不正な行為, 見返り]
      - type: conduct
        desc: （2項）公務員が職務上不正な行為をした（相当の行為をしなかった）ことに関し、賄賂を収受・要求・約束し、又は第三者に供与させる
        keywords: [便宜の見返り, 謝礼]
      - type: conduct
        desc: （3項・事後収賄）公務員であった者が、在職中に請託を受けて職務上不正な行為をした（相当の行為をしなかった）ことに関し、賄賂を収受・要求・約束する
        keywords: [事後収賄, 退職後に謝礼]
      - type: intent
        desc: 職務関連性の認識
        keywords: []
    penalties:
      - type: imprisonment
        min: 1
        max: null
        unit: year
        note: 1年以上の有期拘禁刑（1項・2項）
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑（3項・事後収賄）
    statute_text: "公務員が前二条の罪を犯し、よって不正な行為をし、又は相当の行為をしなかったときは、一年以上の有期拘禁刑に処する。\n２　公務員が、その職務上不正な行為をしたこと又は相当の行為をしなかったことに関し、賄賂を収受し、若しくはその要求若しくは約束をし、又は第三者にこれを供与させ、若しくはその供与の要求若しくは約束をしたときも、前項と同様とする。\n３　公務員であった者が、その在職中に請託を受けて職務上不正な行為をしたこと又は相当の行為をしなかったことに関し、賄賂を収受し、又はその要求若しくは約束をしたときは、五年以下の拘禁刑に処する。"
    related_to: [bribe-acceptance, third-party-bribery]

  - id: intermediary-bribery
    label: あっせん収賄罪
    article: "197の4"
    category: CrimeAgainstStateFunction
    legal_interest: 公務の公正とそれに対する社会的信頼
    elements:
      - type: object
        desc: 公務員
        keywords: [公務員, 議員]
      - type: conduct
        desc: 請託を受け、他の公務員に職務上不正な行為をさせる（相当の行為をさせない）ようにあっせんをすること又はしたことの報酬として、賄賂を収受・要求・約束する
        keywords: [口利き, あっせん, 斡旋]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
    statute_text: "公務員が請託を受け、他の公務員に職務上不正な行為をさせるように、又は相当の行為をさせないようにあっせんをすること又はしたことの報酬として、賄賂を収受し、又はその要求若しくは約束をしたときは、五年以下の拘禁刑に処する。"
    related_to: [bribe-acceptance]

  - id: bribe-giving
    label: 贈賄罪
    article: "198"
    category: CrimeAgainstStateFunction
    legal_interest: 公務の公正とそれに対する社会的信頼
    elements:
      - type: object
        desc: 197条から197条の4までに規定する賄賂
        keywords: [賄賂, わいろ]
      - type: conduct
        desc: 賄賂を供与し、又はその申込み若しくは約束をする
        keywords: [贈賄, 賄賂を渡す, 接待, 金品を贈る]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 2500000
        unit: yen
        note: 250万円以下の罰金
    statute_text: "第百九十七条から第百九十七条の四までに規定する賄賂を供与し、又はその申込み若しくは約束をした者は、三年以下の拘禁刑又は二百五十万円以下の罰金に処する。"
    related_to: [bribe-acceptance, third-party-bribery, aggravated-bribery, intermediary-bribery]

  # ================================================================
  # 【個人的法益に対する罪】
  # ================================================================

  # --- 第26章 殺人の罪 (199-203) ---
  - id: homicide
    label: 殺人罪
    article: "199"
    category: CrimeAgainstLifeBody
    legal_interest: 人の生命
    elements:
      - type: object
        desc: 他人(自然人)
        keywords: [殺された, 殺す, 殺害, 刺された, 命を奪われた]
      - type: conduct
        desc: 人を殺す
        keywords: [殺す, 殺害, 刺す, 絞める, 毒殺]
      - type: result
        desc: 死亡
        keywords: [死亡, 死んだ]
      - type: intent
        desc: 殺意(故意)
        keywords: [殺意, 殺すつもり]
    penalties:
      - type: death
        note: 死刑又は無期若しくは5年以上の拘禁刑
      - type: imprisonment
        min: 5
        max: null
        unit: year
        note: 死刑又は無期若しくは5年以上の拘禁刑
    statute_text: "人を殺した者は、死刑又は無期若しくは五年以上の拘禁刑に処する。"

  # --- 第27章 傷害の罪 (204-208の2) ---
  - id: injury
    label: 傷害罪
    article: "204"
    category: CrimeAgainstLifeBody
    legal_interest: 人の身体
    elements:
      - type: object
        desc: 他人の身体
        keywords: [怪我, けが, 負傷, 傷, 殴られた, 入院]
      - type: conduct
        desc: 人の身体を傷害する
        keywords: [殴る, 叩く, 蹴る, 傷つける, 暴行, ボコ]
      - type: result
        desc: 生理的機能の障害(傷害結果)
        keywords: [怪我, けが, 骨折, 打撲, あざ, 出血]
      - type: intent
        desc: 故意(暴行の故意で足りる)
        keywords: []
    penalties:
      - type: imprisonment
        max: 15
        unit: year
        note: 15年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "人の身体を傷害した者は、十五年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [assault, injury-causing-death]

  - id: injury-causing-death
    label: 傷害致死罪
    article: "205"
    category: CrimeAgainstLifeBody
    legal_interest: 人の身体・生命
    elements:
      - type: conduct
        desc: 身体を傷害し死亡させる
        keywords: [殴って死なせた, 暴行で死亡, 傷害致死]
      - type: result
        desc: 死亡
        keywords: [死亡, 死んだ]
      - type: intent
        desc: 傷害の故意(殺意不要)
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: null
        unit: year
        note: 3年以上の有期拘禁刑
    statute_text: "身体を傷害し、よって人を死亡させた者は、三年以上の有期拘禁刑に処する。"

  - id: assault
    label: 暴行罪
    article: "208"
    category: CrimeAgainstLifeBody
    legal_interest: 人の身体
    elements:
      - type: conduct
        desc: 暴行を加えたが傷害に至らない
        keywords: [殴られた, 叩かれた, 蹴られた, 突き飛ばされた, 暴力, ボコ, 小突かれた]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金又は拘留若しくは科料
    statute_text: "暴行を加えた者が人を傷害するに至らなかったときは、二年以下の拘禁刑若しくは三十万円以下の罰金又は拘留若しくは科料に処する。"
    related_to: [injury]

  # --- 第28章 過失傷害の罪 (209-211) ---
  - id: negligent-homicide
    label: 過失致死罪
    article: "210"
    category: CrimeAgainstLifeBody
    legal_interest: 人の生命
    elements:
      - type: conduct
        desc: 過失により人を死亡させる
        keywords: [過失, うっかり, 事故, 不注意, 死なせた]
      - type: result
        desc: 死亡
        keywords: [死亡]
      - type: intent
        desc: 過失
        keywords: []
    penalties:
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "過失により人を死亡させた者は、五十万円以下の罰金に処する。"

  # --- 第29章 堕胎の罪 (212-216) ---
  - id: self-abortion
    label: 堕胎罪
    article: "212"
    category: CrimeAgainstLifeBody
    legal_interest: 胎児の生命・母体
    elements:
      - type: conduct
        desc: 妊娠中の女子が薬物等で堕胎する
        keywords: [堕胎, 中絶]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑
    statute_text: "妊娠中の女子が薬物を用い、又はその他の方法により、堕胎したときは、一年以下の拘禁刑に処する。"

  # --- 第30章 遺棄の罪 (217-219) ---
  - id: abandonment
    label: 遺棄罪
    article: "217"
    category: CrimeAgainstLifeBody
    legal_interest: 人の生命・身体の安全
    elements:
      - type: object
        desc: 老年・幼年・身体障害・疾病のため扶助を必要とする者
        keywords: [遺棄, 置き去り, 放置, 見捨てる]
      - type: conduct
        desc: 遺棄する
        keywords: [遺棄, 置き去り, 放置]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑
    statute_text: "老年、幼年、身体障害又は疾病のために扶助を必要とする者を遺棄した者は、一年以下の拘禁刑に処する。"

  # --- 第31章 逮捕及び監禁の罪 (220-221) ---
  - id: unlawful-capture-confinement
    label: 逮捕監禁罪
    article: "220"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の身体活動の自由
    elements:
      - type: object
        desc: 他人
        keywords: [監禁, 閉じ込められた, 拘束, 逮捕, 縛られた]
      - type: conduct
        desc: 不法に逮捕し又は監禁する
        keywords: [監禁, 閉じ込める, 拘束, 縛る, 軟禁]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 84
        unit: month
        note: 3月以上7年以下の拘禁刑
    statute_text: "不法に人を逮捕し、又は監禁した者は、三月以上七年以下の拘禁刑に処する。"

  # --- 第32章 脅迫の罪 (222-223) ---
  - id: intimidation
    label: 脅迫罪
    article: "222"
    category: CrimeAgainstFreedomHonor
    legal_interest: 意思決定の自由・私生活の平穏
    elements:
      - type: conduct
        desc: 生命・身体・自由・名誉・財産に害を加える旨を告知して脅迫する
        keywords: [脅された, 殺すと言われた, 脅迫, 危害を加える, 脅し, 恐喝された]
      - type: object
        desc: 本人又は親族（2項）
        keywords: [家族, 親族]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金
    statute_text: "生命、身体、自由、名誉又は財産に対し害を加える旨を告知して人を脅迫した者は、二年以下の拘禁刑又は三十万円以下の罰金に処する。\n２　親族の生命、身体、自由、名誉又は財産に対し害を加える旨を告知して人を脅迫した者も、前項と同様とする。"
    related_to: [compulsion, extortion]

  - id: compulsion
    label: 強要罪
    article: "223"
    category: CrimeAgainstFreedomHonor
    legal_interest: 意思決定・意思活動の自由
    elements:
      - type: conduct
        desc: 脅迫・暴行で義務のないことを行わせ又は権利の行使を妨害する
        keywords: [強要, 無理やりやらされた, 強制, 脅して従わせる, 土下座させられた]
      - type: object
        desc: 本人又は親族（2項。親族への害悪の告知による脅迫）
        keywords: [家族, 親族]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
    statute_text: "生命、身体、自由、名誉若しくは財産に対し害を加える旨を告知して脅迫し、又は暴行を用いて、人に義務のないことを行わせ、又は権利の行使を妨害した者は、三年以下の拘禁刑に処する。\n２　親族の生命、身体、自由、名誉又は財産に対し害を加える旨を告知して脅迫し、人に義務のないことを行わせ、又は権利の行使を妨害した者も、前項と同様とする。\n３　前二項の罪の未遂は、罰する。"
    related_to: [intimidation]

  # --- 第33章 略取、誘拐及び人身売買の罪 (224-229) ---
  - id: kidnapping-minor
    label: 未成年者略取誘拐罪
    article: "224"
    category: CrimeAgainstFreedomHonor
    legal_interest: 被拐取者の自由・保護者の監護権
    elements:
      - type: object
        desc: 未成年者
        keywords: [誘拐, 連れ去り, 略取, 子供が連れ去られた]
      - type: conduct
        desc: 略取し又は誘拐する
        keywords: [誘拐, 連れ去り, 略取]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 84
        unit: month
        note: 3月以上7年以下の拘禁刑
    statute_text: "未成年者を略取し、又は誘拐した者は、三月以上七年以下の拘禁刑に処する。"

  # --- 第34章 名誉に対する罪 (230-232) ---
  - id: defamation
    label: 名誉毀損罪
    article: "230"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の外部的名誉
    elements:
      - type: conduct
        desc: 公然と事実を摘示して人の名誉を毀損する
        keywords: [名誉毀損, 悪口, 噂を流された, 評判, SNS, デマ, 晒された, 誹謗中傷]
      - type: circumstance
        desc: 公然性(不特定又は多数が認識しうる状態)
        keywords: [SNS, ネット, 公然, 掲示板, 拡散]
      - type: object
        desc: （2項）死者の名誉は虚偽の事実を摘示した場合に限り処罰
        keywords: [死者, 故人]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "公然と事実を摘示し、人の名誉を毀損した者は、その事実の有無にかかわらず、三年以下の拘禁刑又は五十万円以下の罰金に処する。\n２　死者の名誉を毀損した者は、虚偽の事実を摘示することによってした場合でなければ、罰しない。"
    related_to: [insult]

  - id: insult
    label: 侮辱罪
    article: "231"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の外部的名誉
    elements:
      - type: conduct
        desc: 事実を摘示せず公然と人を侮辱する
        keywords: [侮辱, バカ, 悪口, 罵倒, SNS, 誹謗中傷, 馬鹿にされた]
      - type: circumstance
        desc: 公然性
        keywords: [SNS, ネット, 公然, 掲示板]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金又は拘留若しくは科料
    statute_text: "事実を摘示しなくても、公然と人を侮辱した者は、一年以下の拘禁刑若しくは三十万円以下の罰金又は拘留若しくは科料に処する。"
    related_to: [defamation]

  # --- 第35章 信用及び業務に対する罪 (233-234の2) ---
  - id: defamation-of-credit
    label: 信用毀損及び業務妨害罪
    article: "233"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の経済的信用・業務
    elements:
      - type: conduct
        desc: 虚偽の風説を流布し又は偽計を用いて信用を毀損し業務を妨害する
        keywords: [業務妨害, 信用毀損, 嘘の噂, 妨害, 営業妨害]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "虚偽の風説を流布し、又は偽計を用いて、人の信用を毀損し、又はその業務を妨害した者は、三年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [forcible-obstruction-of-business]

  - id: forcible-obstruction-of-business
    label: 威力業務妨害罪
    article: "234"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の業務
    elements:
      - type: conduct
        desc: 威力を用いて人の業務を妨害する
        keywords: [業務妨害, 営業妨害, 威力, 妨害, 迷惑行為]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑（前条の例による）
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金（前条の例による）
    statute_text: "威力を用いて人の業務を妨害した者も、前条の例による。"
    related_to: [defamation-of-credit]

  # --- 第36章 窃盗及び強盗の罪 (235-245) ---
  - id: theft
    label: 窃盗罪
    article: "235"
    category: CrimeAgainstProperty
    legal_interest: 財産(占有)
    elements:
      - type: object
        desc: 他人の財物
        keywords: [盗む, 盗まれた, 取られた, 持ち去, 万引き, スリ, 財布, 自転車, 盗難, スられた]
      - type: conduct
        desc: 窃取(占有者の意思に反する占有移転)
        keywords: [盗む, こっそり, 勝手に持って, 盗難, 持ち去る]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "他人の財物を窃取した者は、窃盗の罪とし、十年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [robbery]

  - id: robbery
    label: 強盗罪
    article: "236"
    category: CrimeAgainstProperty
    legal_interest: 財産・人の身体の安全
    elements:
      - type: object
        desc: 他人の財物又は財産上の利益
        keywords: [強盗, 奪われた, 脅して奪う, ひったくり]
      - type: conduct
        desc: 暴行・脅迫を用いて財物を強取する
        keywords: [強盗, 奪う, 脅して奪う, 暴力で奪う]
      - type: conduct
        desc: （2項・強盗利得）同じ方法で財産上不法の利益を得、又は他人に得させる
        keywords: [支払いを免れる, 借金を帳消し]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        min: 5
        max: null
        unit: year
        note: 5年以上の有期拘禁刑
    statute_text: "暴行又は脅迫を用いて他人の財物を強取した者は、強盗の罪とし、五年以上の有期拘禁刑に処する。\n２　前項の方法により、財産上不法の利益を得、又は他人にこれを得させた者も、同項と同様とする。"
    related_to: [theft]

  # --- 第37章 詐欺及び恐喝の罪 (246-251) ---
  - id: fraud
    label: 詐欺罪
    article: "246"
    category: CrimeAgainstProperty
    legal_interest: 財産
    elements:
      - type: conduct
        desc: 人を欺いて財物を交付させる
        keywords: [詐欺, 騙された, だまし取られた, 嘘, 振り込め, 架空請求, 騙し取る]
      - type: conduct
        desc: （2項・詐欺利得）同じ方法で財産上不法の利益を得、又は他人に得させる
        keywords: [無銭飲食, 支払いを免れる]
      - type: result
        desc: 錯誤に基づく財産的処分
        keywords: [振り込んだ, 支払った, 渡した]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
    statute_text: "人を欺いて財物を交付させた者は、十年以下の拘禁刑に処する。\n２　前項の方法により、財産上不法の利益を得、又は他人にこれを得させた者も、同項と同様とする。"
    related_to: [extortion]

  - id: extortion
    label: 恐喝罪
    article: "249"
    category: CrimeAgainstProperty
    legal_interest: 財産・意思決定の自由
    elements:
      - type: conduct
        desc: 人を恐喝して財物を交付させる
        keywords: [恐喝, 脅して金, ゆすり, たかり, 脅し取られた, カツアゲ]
      - type: conduct
        desc: （2項・恐喝利得）同じ方法で財産上不法の利益を得、又は他人に得させる
        keywords: [借金を帳消し, 支払いを免れる]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
    statute_text: "人を恐喝して財物を交付させた者は、十年以下の拘禁刑に処する。\n２　前項の方法により、財産上不法の利益を得、又は他人にこれを得させた者も、同項と同様とする。"
    related_to: [fraud, intimidation]

  # --- 第38章 横領の罪 (252-254) ---
  - id: embezzlement
    label: 横領罪
    article: "252"
    category: CrimeAgainstProperty
    legal_interest: 財産・委託信任関係
    elements:
      - type: object
        desc: 自己の占有する他人の物（2項。公務所から保管を命ぜられた自己の物を含む）
        keywords: [横領, 着服, 使い込み, 預かった金, ネコババ]
      - type: conduct
        desc: 横領する
        keywords: [横領, 着服, 使い込み, 私的流用]
      - type: intent
        desc: 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
    statute_text: "自己の占有する他人の物を横領した者は、五年以下の拘禁刑に処する。\n２　自己の物であっても、公務所から保管を命ぜられた場合において、これを横領した者も、前項と同様とする。"
    related_to: [breach-of-trust]

  - id: breach-of-trust
    label: 背任罪
    article: "247"
    category: CrimeAgainstProperty
    legal_interest: 財産
    elements:
      - type: object
        desc: 他人のためその事務を処理する者
        keywords: [背任, 任務違反, 損害を与えた, 利益相反]
      - type: conduct
        desc: 任務に背く行為で本人に財産上の損害を加える
        keywords: [背任, 任務違反, 損害]
      - type: intent
        desc: 図利加害目的
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "他人のためにその事務を処理する者が、自己若しくは第三者の利益を図り又は本人に損害を加える目的で、その任務に背く行為をし、本人に財産上の損害を加えたときは、五年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [embezzlement]

  # --- 第39章 盗品等に関する罪 (256) ---
  - id: stolen-property
    label: 盗品等関与罪
    article: "256"
    category: CrimeAgainstProperty
    legal_interest: 被害者の追求権・財産
    elements:
      - type: object
        desc: 盗品その他財産に対する罪に当たる行為で領得された物
        keywords: [盗品, 故買, 贓物, 盗まれた物の取引]
      - type: conduct
        desc: （1項）無償で譲り受ける
        keywords: [盗品をもらう, 無償譲受]
      - type: conduct
        desc: （2項）運搬・保管・有償譲受け・有償処分のあっせんをする
        keywords: [盗品, 譲受, 故買]
      - type: intent
        desc: 盗品であることの認識
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑（1項・無償譲受け）
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑及び50万円以下の罰金（2項・併科）
      - type: fine
        max: 500000
        unit: yen
        note: 10年以下の拘禁刑及び50万円以下の罰金（2項・併科）
    statute_text: "盗品その他財産に対する罪に当たる行為によって領得された物を無償で譲り受けた者は、三年以下の拘禁刑に処する。\n２　前項に規定する物を運搬し、保管し、若しくは有償で譲り受け、又はその有償の処分のあっせんをした者は、十年以下の拘禁刑及び五十万円以下の罰金に処する。"

  # --- 第40章 毀棄及び隠匿の罪 (258-264) ---
  - id: property-damage
    label: 器物損壊罪
    article: "261"
    category: CrimeAgainstProperty
    legal_interest: 財産(物の効用)
    elements:
      - type: object
        desc: 他人の物(公用・私用文書等を除く)
        keywords: [器物損壊, 壊された, 壊す, 破損, 傷つけられた, 落書き, 割られた]
      - type: conduct
        desc: 損壊又は傷害する
        keywords: [壊す, 破壊, 損壊, 傷つける, 割る]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金又は科料
    statute_text: "前三条に規定するもののほか、他人の物を損壊し、又は傷害した者は、三年以下の拘禁刑又は三十万円以下の罰金若しくは科料に処する。"

  # --- 第12章 住居を侵す罪 (130-132) ---
  - id: breaking-into-residence
    label: 住居侵入罪
    article: "130"
    category: CrimeAgainstFreedomHonor
    legal_interest: 住居の平穏・管理権
    elements:
      - type: object
        desc: 人の住居・邸宅・建造物・艦船
        keywords: [住居侵入, 不法侵入, 侵入, 勝手に入られた, 空き巣, 侵入された]
      - type: conduct
        desc: 正当な理由なく侵入し又は要求を受けて退去しない
        keywords: [侵入, 勝手に入る, 不法侵入, 退去しない]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金
    statute_text: "正当な理由がないのに、人の住居若しくは人の看守する邸宅、建造物若しくは艦船に侵入し、又は要求を受けたにもかかわらずこれらの場所から退去しなかった者は、三年以下の拘禁刑又は十万円以下の罰金に処する。"

  # --- 第13章 秘密を侵す罪 (133-135) ---
  - id: opening-letters
    label: 信書開封罪
    article: "133"
    category: CrimeAgainstFreedomHonor
    legal_interest: 個人の秘密・通信の秘密
    elements:
      - type: object
        desc: 封をしてある他人の信書
        keywords: [信書開封, 手紙を勝手に開けられた, 郵便, 開封]
      - type: conduct
        desc: 正当な理由なく開封する
        keywords: [開封, 勝手に開ける]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑
      - type: fine
        max: 200000
        unit: yen
        note: 20万円以下の罰金
    statute_text: "正当な理由がないのに、封をしてある信書を開けた者は、一年以下の拘禁刑又は二十万円以下の罰金に処する。"

  # --- 第11章 往来を妨害する罪 (124-129) ---
  - id: obstruction-of-traffic
    label: 往来妨害罪
    article: "124"
    category: CrimeAgainstPublicSafety
    legal_interest: 交通の安全
    elements:
      - type: object
        desc: 陸路・水路・橋
        keywords: [往来妨害, 道路封鎖, 通行妨害, 交通妨害]
      - type: conduct
        desc: 損壊又は閉塞して往来の妨害を生じさせる
        keywords: [妨害, 封鎖, 閉塞]
      - type: result
        desc: （2項・往来妨害致死傷）よって人を死傷させる
        keywords: [死傷]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
      - type: fine
        max: 200000
        unit: yen
        note: 20万円以下の罰金
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: （2項）傷害の罪と比較して、重い刑により処断する
    statute_text: "陸路、水路又は橋を損壊し、又は閉塞して往来の妨害を生じさせた者は、二年以下の拘禁刑又は二十万円以下の罰金に処する。\n２　前項の罪を犯し、よって人を死傷させた者は、傷害の罪と比較して、重い刑により処断する。"
