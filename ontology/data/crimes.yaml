  # --- 第17章 文書偽造の罪 (154-161の2) ---
  - id: counterfeiting-imperial-document
    label: 詔書偽造等罪
    article: "154"
    category: CrimeAgainstPublicTrust
    legal_interest: 文書に対する公共の信用
    elements:
      - type: object
        desc: 御璽・国璽・御名を使用した詔書その他の文書
        keywords: [詔書, 御璽, 国璽, 御名]
      - type: conduct
        desc: 偽造する（2項：御璽等を押し又は御名を署した文書を変造する）
        keywords: [偽造, 変造]
      - type: intent
        desc: 行使の目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: null
        unit: year
        note: 無期又は3年以上の拘禁刑
    statute_text: "行使の目的で、御璽、国璽若しくは御名を使用して詔書その他の文書を偽造し、又は偽造した御璽、国璽若しくは御名を使用して詔書その他の文書を偽造した者は、無期又は三年以上の拘禁刑に処する。\n２　御璽若しくは国璽を押し又は御名を署した詔書その他の文書を変造した者も、前項と同様とする。"

  - id: counterfeiting-official-document
    label: 公文書偽造等罪
    article: "155"
    category: CrimeAgainstPublicTrust
    legal_interest: 文書に対する公共の信用
    elements:
      - type: object
        desc: 公務所・公務員の作成すべき文書等・電磁的記録文書等
        keywords: [公文書, 住民票, 免許証, 証明書, 戸籍謄本]
      - type: conduct
        desc: （1項・有印）公務所・公務員の印章等・電磁的記録印章等を使用して偽造する
        keywords: [偽造, 偽の証明書]
      - type: conduct
        desc: （2項）公務所・公務員が押印・署名した文書等又は電磁的記録印章等を使用して作成した電磁的記録文書等を変造する
        keywords: [変造, 改ざん]
      - type: conduct
        desc: （3項・無印）前二項以外の公文書等・電磁的記録文書等を偽造し、又は変造する
        keywords: [偽造, 変造]
      - type: intent
        desc: 行使の目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 1
        max: 10
        unit: year
        note: 1年以上10年以下の拘禁刑（1項・2項）
      - type: imprisonment
        max: 3
        unit: year
        note: （3項）3年以下の拘禁刑
      - type: fine
        max: 200000
        unit: yen
        note: （3項）20万円以下の罰金
    statute_text: "行使の目的で、次の各号に掲げるいずれかの行為をした者は、一年以上十年以下の拘禁刑に処する。\n一　公務所若しくは公務員の印章若しくは署名（以下この章、第百六十五条及び第百六十七条において「印章等」という。）を使用して公務所若しくは公務員の作成すべき文書若しくは図画（以下この章において「文書等」という。）を偽造し、又は偽造した公務所若しくは公務員の印章等を使用して公務所若しくは公務員の作成すべき文書等を偽造する行為\n二　公務所若しくは公務員の電磁的記録印章等（印章等として表示されることとなる電磁的記録をいう。以下この章、第百六十五条及び第百六十七条において同じ。）を使用して公務所若しくは公務員の作成すべき電磁的記録文書等（文書等として表示されて行使されることとなる電磁的記録をいう。以下この章において同じ。）を偽造し、又は偽造した公務所若しくは公務員の電磁的記録印章等を使用して公務所若しくは公務員の作成すべき電磁的記録文書等を偽造する行為\n２　公務所若しくは公務員が押印し若しくは署名した文書等又は公務所若しくは公務員が電磁的記録印章等を使用して作成した電磁的記録文書等を変造した者も、前項と同様とする。\n３　前二項に規定するもののほか、公務所若しくは公務員の作成すべき文書等若しくは電磁的記録文書等を偽造し、又は公務所若しくは公務員が作成した文書等若しくは電磁的記録文書等を変造した者は、三年以下の拘禁刑又は二十万円以下の罰金に処する。"

  - id: false-official-document
