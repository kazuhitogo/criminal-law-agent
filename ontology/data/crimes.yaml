    elements:
      - type: object
        desc: 富くじ
        keywords: [富くじ, 私設の宝くじ, くじ]
      - type: conduct
        desc: 発売する（2項：発売の取次ぎをする、3項：授受する）
        keywords: [発売, 取次ぎ, 授受, 購入]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑（1項）
      - type: fine
        max: 1500000
        unit: yen
        note: 150万円以下の罰金（1項）
      - type: imprisonment
        max: 1
        unit: year
        note: （2項）1年以下の拘禁刑
      - type: fine
        max: 1000000
        unit: yen
        note: （2項）100万円以下の罰金
      - type: fine
        max: 200000
        unit: yen
        note: （3項）20万円以下の罰金又は科料
    statute_text: "富くじを発売した者は、二年以下の拘禁刑又は百五十万円以下の罰金に処する。\n２　富くじ発売の取次ぎをした者は、一年以下の拘禁刑又は百万円以下の罰金に処する。\n３　前二項に規定するもののほか、富くじを授受した者は、二十万円以下の罰金又は科料に処する。"
    related_to: [gambling]

  # --- 第24章 礼拝所及び墳墓に関する罪 (188-192) ---
  - id: disrespect-worship-place
    label: 礼拝所不敬罪
    article: "188"
    category: CrimeAgainstPublicMorals
    legal_interest: 国民の宗教的感情
    elements:
      - type: object
        desc: 神祠・仏堂・墓所その他の礼拝所
        keywords: [神社, 墓, 礼拝所, 仏堂, 不敬, 損壊]
      - type: conduct
        desc: 公然と不敬な行為をする
        keywords: [不敬, 荒らす, 汚す]
      - type: conduct
        desc: （2項・説教等妨害）説教・礼拝・葬式を妨害する
        keywords: [葬式を妨害, 礼拝を妨害, 説教を妨害]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 6
        unit: month
        note: 6月以下の拘禁刑（1項）
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑（2項）
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金
    statute_text: "神祠、仏堂、墓所その他の礼拝所に対し、公然と不敬な行為をした者は、六月以下の拘禁刑又は十万円以下の罰金に処する。\n２　説教、礼拝又は葬式を妨害した者は、一年以下の拘禁刑又は十万円以下の罰金に処する。"

  - id: grave-desecration
    label: 墳墓発掘罪
    article: "189"
    category: CrimeAgainstPublicMorals
    legal_interest: 国民の宗教的感情・死者に対する敬虔感情
    elements:
      - type: object
        desc: 墳墓
        keywords: [墓, 墳墓, お墓]
      - type: conduct
        desc: 発掘する
        keywords: [発掘, 掘り返, 墓を掘]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
    statute_text: "墳墓を発掘した者は、二年以下の拘禁刑に処する。"
    related_to: [disrespect-worship-place]

  - id: corpse-desecration
    label: 死体損壊等罪
    article: "190"
    category: CrimeAgainstPublicMorals
    legal_interest: 国民の宗教的感情・死者に対する敬虔感情
    elements:
      - type: object
        desc: 死体・遺骨・遺髪又は棺に納めてある物
        keywords: [死体, 遺体, 遺骨, 遺髪]
      - type: conduct
        desc: 損壊・遺棄・領得する
        keywords: [死体遺棄, 遺体を遺棄, 死体を損壊, 遺骨を持ち去]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
    statute_text: "死体、遺骨、遺髪又は棺に納めてある物を損壊し、遺棄し、又は領得した者は、三年以下の拘禁刑に処する。"

  - id: grave-desecration-corpse
    label: 墳墓発掘死体損壊等罪
    article: "191"
    category: CrimeAgainstPublicMorals
    legal_interest: 国民の宗教的感情・死者に対する敬虔感情
    elements:
      - type: conduct
        desc: 墳墓発掘（189条）の罪を犯す
        keywords: [墓を掘, 発掘]
      - type: conduct
        desc: 死体・遺骨・遺髪又は棺に納めてある物を損壊・遺棄・領得する
        keywords: [遺骨を持ち去, 損壊, 領得]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: 3月以上5年以下の拘禁刑
    statute_text: "第百八十九条の罪を犯して、死体、遺骨、遺髪又は棺に納めてある物を損壊し、遺棄し、又は領得した者は、三月以上五年以下の拘禁刑に処する。"
    related_to: [grave-desecration, corpse-desecration]

  - id: secret-burial
    label: 変死者密葬罪
    article: "192"
    category: CrimeAgainstPublicMorals
    legal_interest: 犯罪捜査（検視）の適正
    elements:
      - type: object
        desc: 変死者
        keywords: [変死, 不審死]
      - type: conduct
        desc: 検視を経ないで葬る
        keywords: [検視を経ない, 勝手に葬, 密葬]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金又は科料
    statute_text: "検視を経ないで変死者を葬った者は、十万円以下の罰金又は科料に処する。"

  # --- 第25章 汚職の罪 (193-198) ---
  - id: abuse-of-authority
    label: 公務員職権濫用罪
    article: "193"
    category: CrimeAgainstStateFunction
    legal_interest: 国家作用の公正・個人の自由
    elements:
      - type: object
        desc: 公務員
        keywords: [職権濫用, 公務員, 権力乱用]
      - type: conduct
        desc: 職権を濫用して義務のないことを行わせ又は権利の行使を妨害する
        keywords: [職権濫用, 権力乱用, 強要]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
    statute_text: "公務員がその職権を濫用して、人に義務のないことを行わせ、又は権利の行使を妨害したときは、二年以下の拘禁刑に処する。"

  - id: special-abuse-of-authority
    label: 特別公務員職権濫用罪
    article: "194"
    category: CrimeAgainstStateFunction
    legal_interest: 国家作用の公正・個人の身体活動の自由
    elements:
      - type: object
        desc: 裁判・検察・警察の職務を行う者又はこれを補助する者（身分犯）
        keywords: [警察官, 検察官, 裁判官]
      - type: conduct
        desc: 職権を濫用して人を逮捕し又は監禁する
        keywords: [不当逮捕, 違法逮捕, 不当な拘束]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 6
        max: 120
        unit: month
        note: 6月以上10年以下の拘禁刑
    statute_text: "裁判、検察若しくは警察の職務を行う者又はこれらの職務を補助する者がその職権を濫用して、人を逮捕し、又は監禁したときは、六月以上十年以下の拘禁刑に処する。"
    related_to: [abuse-of-authority, unlawful-capture-confinement]

  - id: violence-by-special-official
    label: 特別公務員暴行陵虐罪
    article: "195"
    category: CrimeAgainstStateFunction
    legal_interest: 国家作用の公正・被告人等の人権
    elements:
      - type: object
        desc: 裁判・検察・警察の職務を行う者又はこれを補助する者（2項は拘禁された者を看守・護送する者）
        keywords: [警察官, 刑務官, 看守]
      - type: conduct
        desc: 職務を行うに当たり、被告人・被疑者その他の者に暴行又は陵辱若しくは加虐の行為をする
        keywords: [取り調べで暴行, 拷問, 虐待, 陵辱]
      - type: conduct
        desc: （2項）看守・護送する者が、拘禁された者に暴行又は陵辱若しくは加虐の行為をする
        keywords: [受刑者への暴行, 看守の虐待]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 7
        unit: year
        note: 7年以下の拘禁刑
    statute_text: "裁判、検察若しくは警察の職務を行う者又はこれらの職務を補助する者が、その職務を行うに当たり、被告人、被疑者その他の者に対して暴行又は陵辱若しくは加虐の行為をしたときは、七年以下の拘禁刑に処する。\n２　法令により拘禁された者を看守し又は護送する者がその拘禁された者に対して暴行又は陵辱若しくは加虐の行為をしたときも、前項と同様とする。"
    related_to: [abuse-of-authority, assault]

  - id: special-abuse-causing-death-injury
    label: 特別公務員職権濫用等致死傷罪
    article: "196"
    category: CrimeAgainstStateFunction
    legal_interest: 国家作用の公正・個人の生命身体
    elements:
      - type: conduct
        desc: 特別公務員職権濫用罪（194条）又は特別公務員暴行陵虐罪（195条）を犯す
        keywords: [不当逮捕, 取り調べで暴行]
      - type: result
        desc: よって人を死傷させる
        keywords: [死傷, 怪我, 死亡]
      - type: intent
        desc: 基本犯の故意（死傷結果の故意は不要）
        keywords: []
    penalties:
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: 傷害の罪と比較して、重い刑により処断する
    statute_text: "前二条の罪を犯し、よって人を死傷させた者は、傷害の罪と比較して、重い刑により処断する。"
    related_to: [special-abuse-of-authority, violence-by-special-official, injury, injury-causing-death]

  - id: bribe-acceptance
    label: 収賄罪
    article: "197"
    category: CrimeAgainstStateFunction
    legal_interest: 公務の公正とそれに対する社会的信頼
    elements:
      - type: object
        desc: 公務員
        keywords: [収賄, 賄賂, わいろ, 公務員, 袖の下]
      - type: conduct
        desc: 職務に関し賄賂を収受・要求・約束する（請託を受けたときは受託収賄）
        keywords: [賄賂, 収賄, わいろ, 受け取る]
      - type: conduct
        desc: （2項・事前収賄）公務員になろうとする者が請託を受けて賄賂を収受・要求・約束し、公務員となる
        keywords: [事前収賄]
      - type: intent
        desc: 職務関連性の認識
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
      - type: imprisonment
        max: 7
        unit: year
        note: 請託を受けたときは7年以下の拘禁刑
    statute_text: "公務員が、その職務に関し、賄賂を収受し、又はその要求若しくは約束をしたときは、五年以下の拘禁刑に処する。この場合において、請託を受けたときは、七年以下の拘禁刑に処する。\n２　公務員になろうとする者が、その担当すべき職務に関し、請託を受けて、賄賂を収受し、又はその要求若しくは約束をしたときは、公務員となった場合において、五年以下の拘禁刑に処する。"

  - id: third-party-bribery
    label: 第三者供賄罪
    article: "197の2"
    category: CrimeAgainstStateFunction
    legal_interest: 公務の公正とそれに対する社会的信頼
    elements:
      - type: object
        desc: 公務員
        keywords: [公務員]
      - type: circumstance
        desc: 職務に関し請託を受けること
        keywords: [請託, 頼まれて]
      - type: conduct
        desc: 第三者に賄賂を供与させ、又はその供与の要求若しくは約束をする
        keywords: [第三者に賄賂, 献金させる, 寄付させる]
      - type: intent
        desc: 職務関連性の認識
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
    statute_text: "公務員が、その職務に関し、請託を受けて、第三者に賄賂を供与させ、又はその供与の要求若しくは約束をしたときは、五年以下の拘禁刑に処する。"
    related_to: [bribe-acceptance]

  - id: aggravated-bribery
    label: 加重収賄罪
    article: "197の3"
    category: CrimeAgainstStateFunction
    legal_interest: 公務の公正とそれに対する社会的信頼
    elements:
      - type: conduct
        desc: （1項）公務員が収賄・受託収賄・事前収賄・第三者供賄の罪を犯し、よって不正な行為をし又は相当の行為をしない
        keywords: [便宜を図る, 不正な行為, 見返り]
      - type: conduct
        desc: （2項）公務員が職務上不正な行為をした（相当の行為をしなかった）ことに関し、賄賂を収受・要求・約束し、又は第三者に供与させる
        keywords: [便宜の見返り, 謝礼]
      - type: conduct
        desc: （3項・事後収賄）公務員であった者が、在職中に請託を受けて職務上不正な行為をした（相当の行為をしなかった）ことに関し、賄賂を収受・要求・約束する
        keywords: [事後収賄, 退職後に謝礼]
      - type: intent
        desc: 職務関連性の認識
        keywords: []
    penalties:
      - type: imprisonment
        min: 1
        max: null
        unit: year
        note: 1年以上の有期拘禁刑（1項・2項）
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑（3項・事後収賄）
    statute_text: "公務員が前二条の罪を犯し、よって不正な行為をし、又は相当の行為をしなかったときは、一年以上の有期拘禁刑に処する。\n２　公務員が、その職務上不正な行為をしたこと又は相当の行為をしなかったことに関し、賄賂を収受し、若しくはその要求若しくは約束をし、又は第三者にこれを供与させ、若しくはその供与の要求若しくは約束をしたときも、前項と同様とする。\n３　公務員であった者が、その在職中に請託を受けて職務上不正な行為をしたこと又は相当の行為をしなかったことに関し、賄賂を収受し、又はその要求若しくは約束をしたときは、五年以下の拘禁刑に処する。"
    related_to: [bribe-acceptance, third-party-bribery]

  - id: intermediary-bribery
    label: あっせん収賄罪
    article: "197の4"
    category: CrimeAgainstStateFunction
    legal_interest: 公務の公正とそれに対する社会的信頼
    elements:
      - type: object
        desc: 公務員
        keywords: [公務員, 議員]
      - type: conduct
        desc: 請託を受け、他の公務員に職務上不正な行為をさせる（相当の行為をさせない）ようにあっせんをすること又はしたことの報酬として、賄賂を収受・要求・約束する
        keywords: [口利き, あっせん, 斡旋]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
    statute_text: "公務員が請託を受け、他の公務員に職務上不正な行為をさせるように、又は相当の行為をさせないようにあっせんをすること又はしたことの報酬として、賄賂を収受し、又はその要求若しくは約束をしたときは、五年以下の拘禁刑に処する。"
    related_to: [bribe-acceptance]

  - id: bribe-giving
    label: 贈賄罪
    article: "198"
    category: CrimeAgainstStateFunction
    legal_interest: 公務の公正とそれに対する社会的信頼
    elements:
      - type: object
        desc: 197条から197条の4までに規定する賄賂
        keywords: [賄賂, わいろ]
      - type: conduct
        desc: 賄賂を供与し、又はその申込み若しくは約束をする
        keywords: [贈賄, 賄賂を渡す, 接待, 金品を贈る]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 2500000
        unit: yen
        note: 250万円以下の罰金
    statute_text: "第百九十七条から第百九十七条の四までに規定する賄賂を供与し、又はその申込み若しくは約束をした者は、三年以下の拘禁刑又は二百五十万円以下の罰金に処する。"
    related_to: [bribe-acceptance, third-party-bribery, aggravated-bribery, intermediary-bribery]

  # ================================================================
  # 【個人的法益に対する罪】
  # ================================================================

  # --- 第26章 殺人の罪 (199-203) ---
  - id: homicide
    label: 殺人罪
    article: "199"
    category: CrimeAgainstLifeBody
    legal_interest: 人の生命
    elements:
      - type: object
        desc: 他人(自然人)
        keywords: [殺された, 殺す, 殺害, 刺された, 命を奪われた]
      - type: conduct
        desc: 人を殺す
        keywords: [殺す, 殺害, 刺す, 絞める, 毒殺]
      - type: result
        desc: 死亡
        keywords: [死亡, 死んだ]
      - type: intent
        desc: 殺意(故意)
        keywords: [殺意, 殺すつもり]
    penalties:
      - type: death
        note: 死刑又は無期若しくは5年以上の拘禁刑
      - type: imprisonment
        min: 5
        max: null
        unit: year
        note: 死刑又は無期若しくは5年以上の拘禁刑
    statute_text: "人を殺した者は、死刑又は無期若しくは五年以上の拘禁刑に処する。"

  - id: homicide-preparation
    label: 殺人予備罪
    article: "201"
    category: CrimeAgainstLifeBody
    legal_interest: 人の生命
    elements:
      - type: conduct
        desc: 殺人の予備（凶器・毒物の準備等）をする
        keywords: [殺害の準備, 凶器を用意, 毒を用意]
      - type: intent
        desc: 殺人罪（199条）を犯す目的
        keywords: [殺すつもり]
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑（情状により刑を免除できる）
    statute_text: "第百九十九条の罪を犯す目的で、その予備をした者は、二年以下の拘禁刑に処する。ただし、情状により、その刑を免除することができる。"
    related_to: [homicide]

  - id: suicide-involvement
    label: 自殺関与及び同意殺人罪
    article: "202"
    category: CrimeAgainstLifeBody
    legal_interest: 人の生命
    elements:
      - type: conduct
        desc: 人を教唆し若しくは幇助して自殺させる（自殺教唆・自殺幇助）
        keywords: [自殺をそそのかす, 自殺を手伝う, 自殺幇助]
      - type: conduct
        desc: 人の嘱託を受け若しくは承諾を得て殺す（嘱託殺人・承諾殺人）
        keywords: [頼まれて殺す, 嘱託殺人, 同意殺人]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 6
        max: 84
        unit: month
        note: 6月以上7年以下の拘禁刑
    statute_text: "人を教唆し若しくは幇助して自殺させ、又は人をその嘱託を受け若しくはその承諾を得て殺した者は、六月以上七年以下の拘禁刑に処する。"
    related_to: [homicide]

  # --- 第27章 傷害の罪 (204-208の2) ---
  - id: injury
    label: 傷害罪
    article: "204"
    category: CrimeAgainstLifeBody
    legal_interest: 人の身体
    elements:
      - type: object
        desc: 他人の身体
        keywords: [怪我, けが, 負傷, 傷, 殴られた, 入院]
      - type: conduct
        desc: 人の身体を傷害する
        keywords: [殴る, 叩く, 蹴る, 傷つける, 暴行, ボコ]
      - type: result
        desc: 生理的機能の障害(傷害結果)
        keywords: [怪我, けが, 骨折, 打撲, あざ, 出血]
      - type: intent
        desc: 故意(暴行の故意で足りる)
        keywords: []
    penalties:
      - type: imprisonment
        max: 15
        unit: year
        note: 15年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "人の身体を傷害した者は、十五年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [assault, injury-causing-death]

  - id: injury-causing-death
    label: 傷害致死罪
    article: "205"
    category: CrimeAgainstLifeBody
    legal_interest: 人の身体・生命
    elements:
      - type: conduct
        desc: 身体を傷害し死亡させる
        keywords: [殴って死なせた, 暴行で死亡, 傷害致死]
      - type: result
        desc: 死亡
        keywords: [死亡, 死んだ]
      - type: intent
        desc: 傷害の故意(殺意不要)
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: null
        unit: year
        note: 3年以上の有期拘禁刑
    statute_text: "身体を傷害し、よって人を死亡させた者は、三年以上の有期拘禁刑に処する。"

  - id: abetting-at-scene
    label: 現場助勢罪
    article: "206"
    category: CrimeAgainstLifeBody
    legal_interest: 人の身体・生命
    elements:
      - type: circumstance
        desc: 傷害罪・傷害致死罪（204条・205条）の犯罪が行われている現場
        keywords: [喧嘩の現場, けんか]
      - type: conduct
        desc: 現場において勢いを助ける（はやし立てる等。自ら傷害しなくても成立）
        keywords: [はやし立てる, 煽る, 野次を飛ばす]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金若しくは科料
    statute_text: "前二条の犯罪が行われるに当たり、現場において勢いを助けた者は、自ら人を傷害しなくても、一年以下の拘禁刑又は十万円以下の罰金若しくは科料に処する。"
    related_to: [injury, injury-causing-death]

  - id: assault
    label: 暴行罪
    article: "208"
    category: CrimeAgainstLifeBody
    legal_interest: 人の身体
    elements:
      - type: conduct
        desc: 暴行を加えたが傷害に至らない
        keywords: [殴られた, 叩かれた, 蹴られた, 突き飛ばされた, 暴力, ボコ, 小突かれた]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金又は拘留若しくは科料
    statute_text: "暴行を加えた者が人を傷害するに至らなかったときは、二年以下の拘禁刑若しくは三十万円以下の罰金又は拘留若しくは科料に処する。"
    related_to: [injury]

  - id: dangerous-weapon-assembly
    label: 凶器準備集合及び結集罪
    article: "208の2"
    category: CrimeAgainstLifeBody
    legal_interest: 個人の生命・身体・財産・公共の平穏
    elements:
      - type: circumstance
        desc: 2人以上の者が他人の生命・身体・財産に対し共同して害を加える目的で集合した場合
        keywords: [集団, 抗争, 襲撃]
      - type: conduct
        desc: （1項・凶器準備集合）凶器を準備して又はその準備があることを知って集合する
        keywords: [凶器を持って集まる, 鉄パイプ, 木刀, 金属バット]
      - type: conduct
        desc: （2項・凶器準備結集）凶器を準備して又はその準備があることを知って人を集合させる
        keywords: [人を集める, 招集]
      - type: intent
        desc: 共同加害の目的
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: （1項）2年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: （1項）30万円以下の罰金
      - type: imprisonment
        max: 3
        unit: year
        note: （2項・結集）3年以下の拘禁刑
    statute_text: "二人以上の者が他人の生命、身体又は財産に対し共同して害を加える目的で集合した場合において、凶器を準備して又はその準備があることを知って集合した者は、二年以下の拘禁刑又は三十万円以下の罰金に処する。\n２　前項の場合において、凶器を準備して又はその準備があることを知って人を集合させた者は、三年以下の拘禁刑に処する。"
    related_to: [injury, assault]

  # --- 第28章 過失傷害の罪 (209-211) ---
  - id: negligent-injury
    label: 過失傷害罪
    article: "209"
    category: CrimeAgainstLifeBody
    legal_interest: 人の身体
    elements:
      - type: conduct
        desc: 過失により人を傷害する
        keywords: [不注意, うっかり, ぶつかって怪我]
      - type: result
        desc: 傷害
        keywords: [怪我, けが, 負傷]
      - type: circumstance
        desc: （2項）告訴がなければ公訴を提起できない
        keywords: [告訴]
      - type: intent
        desc: 過失
        keywords: []
    penalties:
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金又は科料
    statute_text: "過失により人を傷害した者は、三十万円以下の罰金又は科料に処する。\n２　前項の罪は、告訴がなければ公訴を提起することができない。"
    related_to: [negligent-homicide, professional-negligence]
  - id: negligent-homicide
    label: 過失致死罪
    article: "210"
    category: CrimeAgainstLifeBody
    legal_interest: 人の生命
    elements:
      - type: conduct
        desc: 過失により人を死亡させる
        keywords: [過失, うっかり, 事故, 不注意, 死なせた]
      - type: result
        desc: 死亡
        keywords: [死亡]
      - type: intent
        desc: 過失
        keywords: []
    penalties:
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "過失により人を死亡させた者は、五十万円以下の罰金に処する。"

  - id: professional-negligence
    label: 業務上過失致死傷等罪
    article: "211"
    category: CrimeAgainstLifeBody
    legal_interest: 人の生命・身体
    elements:
      - type: conduct
        desc: 業務上必要な注意を怠り、人を死傷させる（業務上過失致死傷）
        keywords: [業務上過失, 医療ミス, 作業中の事故]
      - type: conduct
        desc: 重大な過失により人を死傷させる（重過失致死傷）
        keywords: [重過失, 重大な過失, 自転車事故]
      - type: result
        desc: 人の死傷
        keywords: [死亡, 怪我, 負傷]
      - type: intent
        desc: 過失
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
      - type: fine
        max: 1000000
        unit: yen
        note: 100万円以下の罰金
    statute_text: "業務上必要な注意を怠り、よって人を死傷させた者は、五年以下の拘禁刑又は百万円以下の罰金に処する。重大な過失により人を死傷させた者も、同様とする。"
    related_to: [negligent-injury, negligent-homicide]

  # --- 第29章 堕胎の罪 (212-216) ---
  - id: self-abortion
    label: 堕胎罪
    article: "212"
    category: CrimeAgainstLifeBody
    legal_interest: 胎児の生命・母体
    elements:
      - type: conduct
        desc: 妊娠中の女子が薬物等で堕胎する
        keywords: [堕胎, 中絶]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑
    statute_text: "妊娠中の女子が薬物を用い、又はその他の方法により、堕胎したときは、一年以下の拘禁刑に処する。"

  - id: consensual-abortion
    label: 同意堕胎及び同致死傷罪
    article: "213"
    category: CrimeAgainstLifeBody
    legal_interest: 胎児の生命・母体
    elements:
      - type: conduct
        desc: 女子の嘱託を受け、又はその承諾を得て堕胎させる
        keywords: [堕胎させる, 中絶させる]
      - type: result
        desc: （後段）よって女子を死傷させる
        keywords: [死傷, 死亡]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: （致死傷）3月以上5年以下の拘禁刑
    statute_text: "女子の嘱託を受け、又はその承諾を得て堕胎させた者は、二年以下の拘禁刑に処する。よって女子を死傷させた者は、三月以上五年以下の拘禁刑に処する。"
    related_to: [self-abortion, professional-abortion]

  - id: professional-abortion
    label: 業務上堕胎及び同致死傷罪
    article: "214"
    category: CrimeAgainstLifeBody
    legal_interest: 胎児の生命・母体
    elements:
      - type: object
        desc: 行為者が医師・助産師・薬剤師・医薬品販売業者
        keywords: [医師, 助産師, 薬剤師]
      - type: conduct
        desc: 女子の嘱託を受け、又はその承諾を得て堕胎させる
        keywords: [堕胎させる, 中絶させる]
      - type: result
        desc: （後段）よって女子を死傷させる
        keywords: [死傷, 死亡]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: 3月以上5年以下の拘禁刑
      - type: imprisonment
        min: 6
        max: 84
        unit: month
        note: （致死傷）6月以上7年以下の拘禁刑
    statute_text: "医師、助産師、薬剤師又は医薬品販売業者が女子の嘱託を受け、又はその承諾を得て堕胎させたときは、三月以上五年以下の拘禁刑に処する。よって女子を死傷させたときは、六月以上七年以下の拘禁刑に処する。"
    related_to: [consensual-abortion]

  - id: non-consensual-abortion
    label: 不同意堕胎罪
    article: "215"
    category: CrimeAgainstLifeBody
    legal_interest: 胎児の生命・母体
    elements:
      - type: conduct
        desc: 女子の嘱託を受けないで、又はその承諾を得ないで堕胎させる
        keywords: [無理やり中絶, 勝手に中絶, 流産させる]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 6
        max: 84
        unit: month
        note: 6月以上7年以下の拘禁刑
    statute_text: "女子の嘱託を受けないで、又はその承諾を得ないで堕胎させた者は、六月以上七年以下の拘禁刑に処する。\n２　前項の罪の未遂は、罰する。"
    related_to: [consensual-abortion]

  - id: non-consensual-abortion-causing-death-injury
    label: 不同意堕胎致死傷罪
    article: "216"
    category: CrimeAgainstLifeBody
    legal_interest: 胎児の生命・母体
    elements:
      - type: conduct
        desc: 不同意堕胎罪（215条）を犯す
        keywords: [無理やり中絶]
      - type: result
        desc: よって女子を死傷させる
        keywords: [死傷, 死亡, 怪我]
      - type: intent
        desc: 基本犯の故意（死傷結果の故意は不要）
        keywords: []
    penalties:
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: 傷害の罪と比較して、重い刑により処断する
    statute_text: "前条の罪を犯し、よって女子を死傷させた者は、傷害の罪と比較して、重い刑により処断する。"
    related_to: [non-consensual-abortion, injury, injury-causing-death]

  # --- 第30章 遺棄の罪 (217-219) ---
  - id: abandonment
    label: 遺棄罪
    article: "217"
    category: CrimeAgainstLifeBody
    legal_interest: 人の生命・身体の安全
    elements:
      - type: object
        desc: 老年・幼年・身体障害・疾病のため扶助を必要とする者
        keywords: [遺棄, 置き去り, 放置, 見捨てる]
      - type: conduct
        desc: 遺棄する
        keywords: [遺棄, 置き去り, 放置]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑
    statute_text: "老年、幼年、身体障害又は疾病のために扶助を必要とする者を遺棄した者は、一年以下の拘禁刑に処する。"

  - id: abandonment-by-guardian
    label: 保護責任者遺棄等罪
    article: "218"
    category: CrimeAgainstLifeBody
    legal_interest: 人の生命・身体の安全
    elements:
      - type: object
        desc: 老年者・幼年者・身体障害者・病者
        keywords: [子ども, 乳児, 高齢者, 病人]
      - type: circumstance
        desc: これらの者を保護する責任のある者（親・介護者等）
        keywords: [親, 保護者, 介護者]
      - type: conduct
        desc: 遺棄し、又はその生存に必要な保護をしない（不保護）
        keywords: [育児放棄, ネグレクト, 食事を与えない, 車内に放置]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: 3月以上5年以下の拘禁刑
    statute_text: "老年者、幼年者、身体障害者又は病者を保護する責任のある者がこれらの者を遺棄し、又はその生存に必要な保護をしなかったときは、三月以上五年以下の拘禁刑に処する。"
    related_to: [abandonment]

  - id: abandonment-causing-death-injury
    label: 遺棄等致死傷罪
    article: "219"
    category: CrimeAgainstLifeBody
    legal_interest: 人の生命・身体
    elements:
      - type: conduct
        desc: 遺棄罪（217条）又は保護責任者遺棄等罪（218条）を犯す
        keywords: [置き去り, 放置, 育児放棄]
      - type: result
        desc: よって人を死傷させる
        keywords: [死亡, 衰弱, 怪我]
      - type: intent
        desc: 基本犯の故意（死傷結果の故意は不要）
        keywords: []
    penalties:
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: 傷害の罪と比較して、重い刑により処断する
    statute_text: "前二条の罪を犯し、よって人を死傷させた者は、傷害の罪と比較して、重い刑により処断する。"
    related_to: [abandonment, abandonment-by-guardian, injury, injury-causing-death]

  # --- 第31章 逮捕及び監禁の罪 (220-221) ---
  - id: unlawful-capture-confinement
    label: 逮捕監禁罪
    article: "220"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の身体活動の自由
    elements:
      - type: object
        desc: 他人
        keywords: [監禁, 閉じ込められた, 拘束, 逮捕, 縛られた]
      - type: conduct
        desc: 不法に逮捕し又は監禁する
        keywords: [監禁, 閉じ込める, 拘束, 縛る, 軟禁]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 84
        unit: month
        note: 3月以上7年以下の拘禁刑
    statute_text: "不法に人を逮捕し、又は監禁した者は、三月以上七年以下の拘禁刑に処する。"

  - id: confinement-causing-death-injury
    label: 逮捕等致死傷罪
    article: "221"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の身体活動の自由・生命身体
    elements:
      - type: conduct
        desc: 逮捕監禁罪（220条）を犯す
        keywords: [監禁, 閉じ込める, 拘束]
      - type: result
        desc: よって人を死傷させる
        keywords: [死亡, 怪我, 衰弱]
      - type: intent
        desc: 基本犯の故意（死傷結果の故意は不要）
        keywords: []
    penalties:
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: 傷害の罪と比較して、重い刑により処断する
    statute_text: "前条の罪を犯し、よって人を死傷させた者は、傷害の罪と比較して、重い刑により処断する。"
    related_to: [unlawful-capture-confinement, injury, injury-causing-death]

  # --- 第32章 脅迫の罪 (222-223) ---
  - id: intimidation
    label: 脅迫罪
    article: "222"
    category: CrimeAgainstFreedomHonor
    legal_interest: 意思決定の自由・私生活の平穏
    elements:
      - type: conduct
        desc: 生命・身体・自由・名誉・財産に害を加える旨を告知して脅迫する
        keywords: [脅された, 殺すと言われた, 脅迫, 危害を加える, 脅し, 恐喝された]
      - type: object
        desc: 本人又は親族（2項）
        keywords: [家族, 親族]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金
    statute_text: "生命、身体、自由、名誉又は財産に対し害を加える旨を告知して人を脅迫した者は、二年以下の拘禁刑又は三十万円以下の罰金に処する。\n２　親族の生命、身体、自由、名誉又は財産に対し害を加える旨を告知して人を脅迫した者も、前項と同様とする。"
    related_to: [compulsion, extortion]

  - id: compulsion
    label: 強要罪
    article: "223"
    category: CrimeAgainstFreedomHonor
    legal_interest: 意思決定・意思活動の自由
    elements:
      - type: conduct
        desc: 脅迫・暴行で義務のないことを行わせ又は権利の行使を妨害する
        keywords: [強要, 無理やりやらされた, 強制, 脅して従わせる, 土下座させられた]
      - type: object
        desc: 本人又は親族（2項。親族への害悪の告知による脅迫）
        keywords: [家族, 親族]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
    statute_text: "生命、身体、自由、名誉若しくは財産に対し害を加える旨を告知して脅迫し、又は暴行を用いて、人に義務のないことを行わせ、又は権利の行使を妨害した者は、三年以下の拘禁刑に処する。\n２　親族の生命、身体、自由、名誉又は財産に対し害を加える旨を告知して脅迫し、人に義務のないことを行わせ、又は権利の行使を妨害した者も、前項と同様とする。\n３　前二項の罪の未遂は、罰する。"
    related_to: [intimidation]

  # --- 第33章 略取、誘拐及び人身売買の罪 (224-229) ---
  - id: kidnapping-minor
    label: 未成年者略取誘拐罪
    article: "224"
    category: CrimeAgainstFreedomHonor
    legal_interest: 被拐取者の自由・保護者の監護権
    elements:
      - type: object
        desc: 未成年者
        keywords: [誘拐, 連れ去り, 略取, 子供が連れ去られた]
      - type: conduct
        desc: 略取し又は誘拐する
        keywords: [誘拐, 連れ去り, 略取]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 84
        unit: month
        note: 3月以上7年以下の拘禁刑
    statute_text: "未成年者を略取し、又は誘拐した者は、三月以上七年以下の拘禁刑に処する。"

  - id: kidnapping-for-profit
    label: 営利目的等略取誘拐罪
    article: "225"
    category: CrimeAgainstFreedomHonor
    legal_interest: 被拐取者の自由・安全
    elements:
      - type: object
        desc: 人（成年・未成年を問わない）
        keywords: [連れ去り, 拉致, さらわれた]
      - type: conduct
        desc: 略取し又は誘拐する
        keywords: [誘拐, 略取, 連れ去る]
      - type: intent
        desc: 営利・わいせつ・結婚又は生命若しくは身体に対する加害の目的
        keywords: [営利目的, わいせつ目的, 結婚目的]
    penalties:
      - type: imprisonment
        min: 1
        max: 10
        unit: year
        note: 1年以上10年以下の拘禁刑
    statute_text: "営利、わいせつ、結婚又は生命若しくは身体に対する加害の目的で、人を略取し、又は誘拐した者は、一年以上十年以下の拘禁刑に処する。"
    related_to: [kidnapping-minor]

  - id: kidnapping-for-ransom
    label: 身の代金目的略取等罪
    article: "225の2"
    category: CrimeAgainstFreedomHonor
    legal_interest: 被拐取者の自由・安全・近親者等の財産
    elements:
      - type: conduct
        desc: （1項）安否を憂慮する者の憂慮に乗じて財物を交付させる目的で、人を略取し又は誘拐する
        keywords: [身代金目的の誘拐]
      - type: conduct
        desc: （2項）人を略取・誘拐した者が、安否を憂慮する者の憂慮に乗じて財物を交付させ、又は要求する
        keywords: [身代金を要求, 身代金]
      - type: intent
        desc: 身の代金を交付させる目的（1項）・故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: null
        unit: year
        note: 無期又は3年以上の拘禁刑
    statute_text: "近親者その他略取され又は誘拐された者の安否を憂慮する者の憂慮に乗じてその財物を交付させる目的で、人を略取し、又は誘拐した者は、無期又は三年以上の拘禁刑に処する。\n２　人を略取し又は誘拐した者が近親者その他略取され又は誘拐された者の安否を憂慮する者の憂慮に乗じて、その財物を交付させ、又はこれを要求する行為をしたときも、前項と同様とする。"
    related_to: [kidnapping-minor, kidnapping-for-profit, ransom-kidnapping-preparation]

  - id: kidnapping-for-transport-abroad
    label: 所在国外移送目的略取誘拐罪
    article: "226"
    category: CrimeAgainstFreedomHonor
    legal_interest: 被拐取者の自由・安全
    elements:
      - type: conduct
        desc: 人を略取し又は誘拐する
        keywords: [連れ去り, 誘拐]
      - type: intent
        desc: 所在国外に移送する目的
        keywords: [海外に連れ去る, 国外に連れ出す]
    penalties:
      - type: imprisonment
        min: 2
        max: null
        unit: year
        note: 2年以上の有期拘禁刑
    statute_text: "所在国外に移送する目的で、人を略取し、又は誘拐した者は、二年以上の有期拘禁刑に処する。"
    related_to: [kidnapping-minor, transporting-kidnapped-abroad]

  - id: human-trafficking
    label: 人身売買罪
    article: "226の2"
    category: CrimeAgainstFreedomHonor
    legal_interest: 被売買者の自由・安全
    elements:
      - type: conduct
        desc: （1項）人を買い受ける
        keywords: [人身売買, 人を買う]
      - type: object
        desc: （2項）未成年者を買い受ける
        keywords: [未成年者, 子ども]
      - type: conduct
        desc: （3項）営利・わいせつ・結婚・生命身体加害の目的で人を買い受ける（4項）人を売り渡す
        keywords: [売り飛ばす, 人を売る]
      - type: conduct
        desc: （5項）所在国外に移送する目的で人を売買する
        keywords: [海外に売る]
      - type: intent
        desc: 故意（3項・5項は各目的）
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: （1項）3月以上5年以下の拘禁刑
      - type: imprisonment
        min: 3
        max: 84
        unit: month
        note: （2項・未成年者）3月以上7年以下の拘禁刑
      - type: imprisonment
        min: 1
        max: 10
        unit: year
        note: （3項・4項）1年以上10年以下の拘禁刑
      - type: imprisonment
        min: 2
        max: null
        unit: year
        note: （5項・国外移送目的）2年以上の有期拘禁刑
    statute_text: "人を買い受けた者は、三月以上五年以下の拘禁刑に処する。\n２　未成年者を買い受けた者は、三月以上七年以下の拘禁刑に処する。\n３　営利、わいせつ、結婚又は生命若しくは身体に対する加害の目的で、人を買い受けた者は、一年以上十年以下の拘禁刑に処する。\n４　人を売り渡した者も、前項と同様とする。\n５　所在国外に移送する目的で、人を売買した者は、二年以上の有期拘禁刑に処する。"
    related_to: [kidnapping-for-profit, kidnapping-for-transport-abroad]

  - id: transporting-kidnapped-abroad
    label: 被略取者等所在国外移送罪
    article: "226の3"
    category: CrimeAgainstFreedomHonor
    legal_interest: 被拐取者等の自由・安全
    elements:
      - type: object
        desc: 略取され、誘拐され、又は売買された者
        keywords: [誘拐された人, 売られた人]
      - type: conduct
        desc: 所在国外に移送する
        keywords: [海外に連れ出す, 国外に移送]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 2
        max: null
        unit: year
        note: 2年以上の有期拘禁刑
    statute_text: "略取され、誘拐され、又は売買された者を所在国外に移送した者は、二年以上の有期拘禁刑に処する。"
    related_to: [kidnapping-for-transport-abroad, human-trafficking]

  - id: delivering-kidnapped-person
    label: 被略取者引渡し等罪
    article: "227"
    category: CrimeAgainstFreedomHonor
    legal_interest: 被拐取者等の自由・安全
    elements:
      - type: object
        desc: 略取され、誘拐され、又は売買された者
        keywords: [誘拐された人, 連れ去られた子ども]
      - type: conduct
        desc: 引き渡し、収受し、輸送し、蔵匿し、又は隠避させる
        keywords: [匿う, 引き渡す, 運ぶ, 受け取る]
      - type: intent
        desc: （1項・2項）略取誘拐等の犯人を幇助する目的（3項）営利・わいせつ・生命身体加害の目的（4項）身の代金目的
        keywords: []
      - type: conduct
        desc: （4項後段）収受した者が、安否を憂慮する者の憂慮に乗じて財物を交付させ、又は要求する
        keywords: [身代金]
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: （1項）3月以上5年以下の拘禁刑
      - type: imprisonment
        min: 1
        max: 10
        unit: year
        note: （2項）1年以上10年以下の拘禁刑
      - type: imprisonment
        min: 6
        max: 84
        unit: month
        note: （3項）6月以上7年以下の拘禁刑
      - type: imprisonment
        min: 2
        max: null
        unit: year
        note: （4項）2年以上の有期拘禁刑
    statute_text: "第二百二十四条、第二百二十五条又は前三条の罪を犯した者を幇助する目的で、略取され、誘拐され、又は売買された者を引き渡し、収受し、輸送し、蔵匿し、又は隠避させた者は、三月以上五年以下の拘禁刑に処する。\n２　第二百二十五条の二第一項の罪を犯した者を幇助する目的で、略取され又は誘拐された者を引き渡し、収受し、輸送し、蔵匿し、又は隠避させた者は、一年以上十年以下の拘禁刑に処する。\n３　営利、わいせつ又は生命若しくは身体に対する加害の目的で、略取され、誘拐され、又は売買された者を引き渡し、収受し、輸送し、又は蔵匿した者は、六月以上七年以下の拘禁刑に処する。\n４　第二百二十五条の二第一項の目的で、略取され又は誘拐された者を収受した者は、二年以上の有期拘禁刑に処する。略取され又は誘拐された者を収受した者が近親者その他略取され又は誘拐された者の安否を憂慮する者の憂慮に乗じて、その財物を交付させ、又はこれを要求する行為をしたときも、同様とする。"
    related_to: [kidnapping-minor, kidnapping-for-profit, kidnapping-for-ransom, human-trafficking]

  - id: ransom-kidnapping-preparation
    label: 身の代金目的略取等予備罪
    article: "228の3"
    category: CrimeAgainstFreedomHonor
    legal_interest: 被拐取者の自由・安全
    elements:
      - type: conduct
        desc: 身の代金目的略取等の予備（下見・道具や隠れ家の準備等）をする
        keywords: [誘拐の準備, 誘拐を計画]
      - type: intent
        desc: 身の代金目的略取等罪（225条の2第1項）を犯す目的
        keywords: [身代金目的]
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑（実行の着手前に自首したときは減軽又は免除）
    statute_text: "第二百二十五条の二第一項の罪を犯す目的で、その予備をした者は、二年以下の拘禁刑に処する。ただし、実行に着手する前に自首した者は、その刑を減軽し、又は免除する。"
    related_to: [kidnapping-for-ransom]

  # --- 第34章 名誉に対する罪 (230-232) ---
  - id: defamation
    label: 名誉毀損罪
    article: "230"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の外部的名誉
    elements:
      - type: conduct
        desc: 公然と事実を摘示して人の名誉を毀損する
        keywords: [名誉毀損, 悪口, 噂を流された, 評判, SNS, デマ, 晒された, 誹謗中傷]
      - type: circumstance
        desc: 公然性(不特定又は多数が認識しうる状態)
        keywords: [SNS, ネット, 公然, 掲示板, 拡散]
      - type: object
        desc: （2項）死者の名誉は虚偽の事実を摘示した場合に限り処罰
        keywords: [死者, 故人]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "公然と事実を摘示し、人の名誉を毀損した者は、その事実の有無にかかわらず、三年以下の拘禁刑又は五十万円以下の罰金に処する。\n２　死者の名誉を毀損した者は、虚偽の事実を摘示することによってした場合でなければ、罰しない。"
    related_to: [insult]

  - id: insult
    label: 侮辱罪
    article: "231"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の外部的名誉
    elements:
      - type: conduct
        desc: 事実を摘示せず公然と人を侮辱する
        keywords: [侮辱, バカ, 悪口, 罵倒, SNS, 誹謗中傷, 馬鹿にされた]
      - type: circumstance
        desc: 公然性
        keywords: [SNS, ネット, 公然, 掲示板]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金又は拘留若しくは科料
    statute_text: "事実を摘示しなくても、公然と人を侮辱した者は、一年以下の拘禁刑若しくは三十万円以下の罰金又は拘留若しくは科料に処する。"
    related_to: [defamation]

  # --- 第35章 信用及び業務に対する罪 (233-234の2) ---
  - id: defamation-of-credit
    label: 信用毀損及び業務妨害罪
    article: "233"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の経済的信用・業務
    elements:
      - type: conduct
        desc: 虚偽の風説を流布し又は偽計を用いて信用を毀損し業務を妨害する
        keywords: [業務妨害, 信用毀損, 嘘の噂, 妨害, 営業妨害]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "虚偽の風説を流布し、又は偽計を用いて、人の信用を毀損し、又はその業務を妨害した者は、三年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [forcible-obstruction-of-business]

  - id: forcible-obstruction-of-business
    label: 威力業務妨害罪
    article: "234"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の業務
    elements:
      - type: conduct
        desc: 威力を用いて人の業務を妨害する
        keywords: [業務妨害, 営業妨害, 威力, 妨害, 迷惑行為]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑（前条の例による）
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金（前条の例による）
    statute_text: "威力を用いて人の業務を妨害した者も、前条の例による。"
    related_to: [defamation-of-credit]

  - id: computer-obstruction-of-business
    label: 電子計算機損壊等業務妨害罪
    article: "234の2"
    category: CrimeAgainstFreedomHonor
    legal_interest: 人の業務
    elements:
      - type: object
        desc: 人の業務に使用する電子計算機・その用に供する電磁的記録
        keywords: [サーバー, 会社のシステム, パソコン]
      - type: conduct
        desc: 電子計算機・電磁的記録を損壊し、虚偽の情報・不正な指令を与え、又はその他の方法で、使用目的に沿う動作をさせず又は反する動作をさせる
        keywords: [サイバー攻撃, DDoS攻撃, データを消去, システムを停止]
      - type: result
        desc: 人の業務を妨害する
        keywords: [業務妨害, 業務が止まった]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
      - type: fine
        max: 1000000
        unit: yen
        note: 100万円以下の罰金
    statute_text: "人の業務に使用する電子計算機若しくはその用に供する電磁的記録を損壊し、若しくは人の業務に使用する電子計算機に虚偽の情報若しくは不正な指令を与え、又はその他の方法により、電子計算機に使用目的に沿うべき動作をさせず、又は使用目的に反する動作をさせて、人の業務を妨害した者は、五年以下の拘禁刑又は百万円以下の罰金に処する。\n２　前項の罪の未遂は、罰する。"
    related_to: [defamation-of-credit, forcible-obstruction-of-business]

  # --- 第36章 窃盗及び強盗の罪 (235-245) ---
  - id: theft
    label: 窃盗罪
    article: "235"
    category: CrimeAgainstProperty
    legal_interest: 財産(占有)
    elements:
      - type: object
        desc: 他人の財物
        keywords: [盗む, 盗まれた, 取られた, 持ち去, 万引き, スリ, 財布, 自転車, 盗難, スられた]
      - type: conduct
        desc: 窃取(占有者の意思に反する占有移転)
        keywords: [盗む, こっそり, 勝手に持って, 盗難, 持ち去る]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "他人の財物を窃取した者は、窃盗の罪とし、十年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [robbery]

  - id: real-estate-usurpation
    label: 不動産侵奪罪
    article: "235の2"
    category: CrimeAgainstProperty
    legal_interest: 不動産の占有
    elements:
      - type: object
        desc: 他人の不動産（土地・建物）
        keywords: [土地, 空き地, 建物]
      - type: conduct
        desc: 侵奪する（占有者の意思に反して不動産の占有を排除し、自己の占有を設定する）
        keywords: [勝手に建物を建てる, 土地を占拠, 不法占拠]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
    statute_text: "他人の不動産を侵奪した者は、十年以下の拘禁刑に処する。"
    related_to: [theft]

  - id: robbery
    label: 強盗罪
    article: "236"
    category: CrimeAgainstProperty
    legal_interest: 財産・人の身体の安全
    elements:
      - type: object
        desc: 他人の財物又は財産上の利益
        keywords: [強盗, 奪われた, 脅して奪う, ひったくり]
      - type: conduct
        desc: 暴行・脅迫を用いて財物を強取する
        keywords: [強盗, 奪う, 脅して奪う, 暴力で奪う]
      - type: conduct
        desc: （2項・強盗利得）同じ方法で財産上不法の利益を得、又は他人に得させる
        keywords: [支払いを免れる, 借金を帳消し]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        min: 5
        max: null
        unit: year
        note: 5年以上の有期拘禁刑
    statute_text: "暴行又は脅迫を用いて他人の財物を強取した者は、強盗の罪とし、五年以上の有期拘禁刑に処する。\n２　前項の方法により、財産上不法の利益を得、又は他人にこれを得させた者も、同項と同様とする。"
    related_to: [theft]

  - id: robbery-preparation
    label: 強盗予備罪
    article: "237"
    category: CrimeAgainstProperty
    legal_interest: 財産・人の身体の安全
    elements:
      - type: conduct
        desc: 強盗の予備（凶器の準備・下見等）をする
        keywords: [強盗の準備, 強盗の計画, 下見]
      - type: intent
        desc: 強盗の罪を犯す目的
        keywords: [強盗するつもり]
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
    statute_text: "強盗の罪を犯す目的で、その予備をした者は、二年以下の拘禁刑に処する。"
    related_to: [robbery]

  - id: constructive-robbery
    label: 事後強盗罪
    article: "238"
    category: CrimeAgainstProperty
    legal_interest: 財産・人の身体の安全
    elements:
      - type: object
        desc: 窃盗（窃盗の既遂犯・未遂犯）
        keywords: [万引き, 窃盗, 泥棒]
      - type: conduct
        desc: 暴行又は脅迫をする
        keywords: [殴る, 突き飛ばす, 脅す]
      - type: intent
        desc: 財物を取り返されることを防ぎ、逮捕を免れ、又は罪跡を隠滅する目的
        keywords: [逃げるため, 捕まらないように, 取り返されないように]
    penalties:
      - type: imprisonment
        min: 5
        max: null
        unit: year
        note: 強盗として論ずる（5年以上の有期拘禁刑）
    statute_text: "窃盗が、財物を得てこれを取り返されることを防ぎ、逮捕を免れ、又は罪跡を隠滅するために、暴行又は脅迫をしたときは、強盗として論ずる。"
    related_to: [theft, robbery]

  - id: robbery-by-stupefaction
    label: 昏酔強盗罪
    article: "239"
    category: CrimeAgainstProperty
    legal_interest: 財産・人の身体の安全
    elements:
      - type: conduct
        desc: 人を昏酔させる（睡眠薬・酒等で意識作用に障害を生じさせる）
        keywords: [睡眠薬, 薬を盛る, 酔わせる]
      - type: conduct
        desc: その財物を盗取する
        keywords: [盗む, 奪う]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        min: 5
        max: null
        unit: year
        note: 強盗として論ずる（5年以上の有期拘禁刑）
    statute_text: "人を昏酔させてその財物を盗取した者は、強盗として論ずる。"
    related_to: [robbery, theft]

  - id: robbery-causing-death-injury
    label: 強盗致死傷罪
    article: "240"
    category: CrimeAgainstProperty
    legal_interest: 財産・人の生命身体
    elements:
      - type: object
        desc: 強盗（強盗罪・事後強盗罪・昏酔強盗罪の既遂犯・未遂犯）
        keywords: [強盗]
      - type: result
        desc: 人を負傷させ（強盗致傷・強盗傷人）、又は死亡させる（強盗致死・強盗殺人）
        keywords: [怪我, 負傷, 死亡, 刺された]
      - type: intent
        desc: 強盗の故意（死傷結果の故意は問わない）
        keywords: []
    penalties:
      - type: imprisonment
        min: 6
        max: null
        unit: year
        note: 負傷させたときは無期又は6年以上の拘禁刑
      - type: death
        note: 死亡させたときは死刑又は無期拘禁刑
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: 死亡させたときは死刑又は無期拘禁刑
    statute_text: "強盗が、人を負傷させたときは無期又は六年以上の拘禁刑に処し、死亡させたときは死刑又は無期拘禁刑に処する。"
    related_to: [robbery, constructive-robbery, robbery-by-stupefaction]

  - id: robbery-and-sexual-intercourse
    label: 強盗・不同意性交等及び同致死罪
    article: "241"
    category: CrimeAgainstProperty
    legal_interest: 財産・性的自由・人の生命身体
    elements:
      - type: conduct
        desc: （1項）強盗の罪（未遂を含む）と不同意性交等罪（177条。未遂を含む）をともに犯す（先後を問わない）
        keywords: [強盗, 性的暴行, レイプ]
      - type: circumstance
        desc: （2項）いずれも未遂のときは、人を死傷させたときを除き刑を減軽できる。自己の意思で中止したときは減軽又は免除
        keywords: []
      - type: result
        desc: （3項）1項の罪に当たる行為により人を死亡させる
        keywords: [死亡]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 7
        max: null
        unit: year
        note: 無期又は7年以上の拘禁刑
      - type: death
        note: （3項・致死）死刑又は無期拘禁刑
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: （3項・致死）死刑又は無期拘禁刑
    statute_text: "強盗の罪若しくはその未遂罪を犯した者が第百七十七条の罪若しくはその未遂罪をも犯したとき、又は同条の罪若しくはその未遂罪を犯した者が強盗の罪若しくはその未遂罪をも犯したときは、無期又は七年以上の拘禁刑に処する。\n２　前項の場合のうち、その犯した罪がいずれも未遂罪であるときは、人を死傷させたときを除き、その刑を減軽することができる。ただし、自己の意思によりいずれかの犯罪を中止したときは、その刑を減軽し、又は免除する。\n３　第一項の罪に当たる行為により人を死亡させた者は、死刑又は無期拘禁刑に処する。"
    related_to: [robbery, non-consensual-sexual-intercourse]

  # --- 第37章 詐欺及び恐喝の罪 (246-251) ---
  - id: fraud
    label: 詐欺罪
    article: "246"
    category: CrimeAgainstProperty
    legal_interest: 財産
    elements:
      - type: conduct
        desc: 人を欺いて財物を交付させる
        keywords: [詐欺, 騙された, だまし取られた, 嘘, 振り込め, 架空請求, 騙し取る]
      - type: conduct
        desc: （2項・詐欺利得）同じ方法で財産上不法の利益を得、又は他人に得させる
        keywords: [無銭飲食, 支払いを免れる]
      - type: result
        desc: 錯誤に基づく財産的処分
        keywords: [振り込んだ, 支払った, 渡した]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
    statute_text: "人を欺いて財物を交付させた者は、十年以下の拘禁刑に処する。\n２　前項の方法により、財産上不法の利益を得、又は他人にこれを得させた者も、同項と同様とする。"
    related_to: [extortion]

  - id: computer-fraud
    label: 電子計算機使用詐欺罪
    article: "246の2"
    category: CrimeAgainstProperty
    legal_interest: 財産
    elements:
      - type: conduct
        desc: 人の事務処理に使用する電子計算機に虚偽の情報・不正な指令を与えて財産権の得喪・変更に係る不実の電磁的記録を作り、又は虚偽の電磁的記録を人の事務処理の用に供する
        keywords: [不正送金, ネットバンキング, 不正にチャージ, 他人のID]
      - type: result
        desc: 財産上不法の利益を得、又は他人に得させる
        keywords: [送金, 残高]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
    statute_text: "前条に規定するもののほか、人の事務処理に使用する電子計算機に虚偽の情報若しくは不正な指令を与えて財産権の得喪若しくは変更に係る不実の電磁的記録を作り、又は財産権の得喪若しくは変更に係る虚偽の電磁的記録を人の事務処理の用に供して、財産上不法の利益を得、又は他人にこれを得させた者は、十年以下の拘禁刑に処する。"
    related_to: [fraud]

  - id: quasi-fraud
    label: 準詐欺罪
    article: "248"
    category: CrimeAgainstProperty
    legal_interest: 財産
    elements:
      - type: circumstance
        desc: 未成年者の知慮浅薄又は人の心神耗弱に乗じる
        keywords: [認知症, 判断能力, 未成年者]
      - type: conduct
        desc: 財物を交付させ、又は財産上不法の利益を得、若しくは他人に得させる
        keywords: [お金を出させる, 契約させる]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
    statute_text: "未成年者の知慮浅薄又は人の心神耗弱に乗じて、その財物を交付させ、又は財産上不法の利益を得、若しくは他人にこれを得させた者は、十年以下の拘禁刑に処する。"
    related_to: [fraud]

  - id: extortion
    label: 恐喝罪
    article: "249"
    category: CrimeAgainstProperty
    legal_interest: 財産・意思決定の自由
    elements:
      - type: conduct
        desc: 人を恐喝して財物を交付させる
        keywords: [恐喝, 脅して金, ゆすり, たかり, 脅し取られた, カツアゲ]
      - type: conduct
        desc: （2項・恐喝利得）同じ方法で財産上不法の利益を得、又は他人に得させる
        keywords: [借金を帳消し, 支払いを免れる]
      - type: intent
        desc: 故意 + 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
    statute_text: "人を恐喝して財物を交付させた者は、十年以下の拘禁刑に処する。\n２　前項の方法により、財産上不法の利益を得、又は他人にこれを得させた者も、同項と同様とする。"
    related_to: [fraud, intimidation]

  # --- 第38章 横領の罪 (252-254) ---
  - id: embezzlement
    label: 横領罪
    article: "252"
    category: CrimeAgainstProperty
    legal_interest: 財産・委託信任関係
    elements:
      - type: object
        desc: 自己の占有する他人の物（2項。公務所から保管を命ぜられた自己の物を含む）
        keywords: [横領, 着服, 使い込み, 預かった金, ネコババ]
      - type: conduct
        desc: 横領する
        keywords: [横領, 着服, 使い込み, 私的流用]
      - type: intent
        desc: 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
    statute_text: "自己の占有する他人の物を横領した者は、五年以下の拘禁刑に処する。\n２　自己の物であっても、公務所から保管を命ぜられた場合において、これを横領した者も、前項と同様とする。"
    related_to: [breach-of-trust]

  - id: professional-embezzlement
    label: 業務上横領罪
    article: "253"
    category: CrimeAgainstProperty
    legal_interest: 財産・委託信任関係
    elements:
      - type: object
        desc: 業務上自己の占有する他人の物
        keywords: [会社の金, 売上金, 預かり金, 会費]
      - type: circumstance
        desc: 業務（社会生活上の地位に基づき反復継続して行う事務）として占有していること
        keywords: [経理, 業務上]
      - type: conduct
        desc: 横領する
        keywords: [横領, 着服, 使い込み]
      - type: intent
        desc: 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
    statute_text: "業務上自己の占有する他人の物を横領した者は、十年以下の拘禁刑に処する。"
    related_to: [embezzlement]

  - id: embezzlement-of-lost-property
    label: 遺失物等横領罪
    article: "254"
    category: CrimeAgainstProperty
    legal_interest: 財産（所有権）
    elements:
      - type: object
        desc: 遺失物・漂流物その他占有を離れた他人の物
        keywords: [落とし物, 拾った, 忘れ物, 放置自転車]
      - type: conduct
        desc: 横領する（自分の物にする）
        keywords: [ネコババ, 持ち帰る, 届けない]
      - type: intent
        desc: 不法領得の意思
        keywords: []
    penalties:
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金若しくは科料
    statute_text: "遺失物、漂流物その他占有を離れた他人の物を横領した者は、一年以下の拘禁刑又は十万円以下の罰金若しくは科料に処する。"
    related_to: [embezzlement, theft]

  - id: breach-of-trust
    label: 背任罪
    article: "247"
    category: CrimeAgainstProperty
    legal_interest: 財産
    elements:
      - type: object
        desc: 他人のためその事務を処理する者
        keywords: [背任, 任務違反, 損害を与えた, 利益相反]
      - type: conduct
        desc: 任務に背く行為で本人に財産上の損害を加える
        keywords: [背任, 任務違反, 損害]
      - type: intent
        desc: 図利加害目的
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "他人のためにその事務を処理する者が、自己若しくは第三者の利益を図り又は本人に損害を加える目的で、その任務に背く行為をし、本人に財産上の損害を加えたときは、五年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [embezzlement]

  # --- 第39章 盗品等に関する罪 (256) ---
  - id: stolen-property
    label: 盗品等関与罪
    article: "256"
    category: CrimeAgainstProperty
    legal_interest: 被害者の追求権・財産
    elements:
      - type: object
        desc: 盗品その他財産に対する罪に当たる行為で領得された物
        keywords: [盗品, 故買, 贓物, 盗まれた物の取引]
      - type: conduct
        desc: （1項）無償で譲り受ける
        keywords: [盗品をもらう, 無償譲受]
      - type: conduct
        desc: （2項）運搬・保管・有償譲受け・有償処分のあっせんをする
        keywords: [盗品, 譲受, 故買]
      - type: intent
        desc: 盗品であることの認識
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑（1項・無償譲受け）
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑及び50万円以下の罰金（2項・併科）
      - type: fine
        max: 500000
        unit: yen
        note: 10年以下の拘禁刑及び50万円以下の罰金（2項・併科）
    statute_text: "盗品その他財産に対する罪に当たる行為によって領得された物を無償で譲り受けた者は、三年以下の拘禁刑に処する。\n２　前項に規定する物を運搬し、保管し、若しくは有償で譲り受け、又はその有償の処分のあっせんをした者は、十年以下の拘禁刑及び五十万円以下の罰金に処する。"

  # --- 第40章 毀棄及び隠匿の罪 (258-264) ---
  - id: damaging-official-document
    label: 公用文書等毀棄罪
    article: "258"
    category: CrimeAgainstProperty
    legal_interest: 公務所の文書・電磁的記録の効用
    elements:
      - type: object
        desc: 公務所の用に供する文書又は電磁的記録
        keywords: [公文書, 役所の書類, 調書]
      - type: conduct
        desc: 毀棄する（破る・隠す・消去する等、効用を害する一切の行為）
        keywords: [破る, 捨てる, 消去]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 84
        unit: month
        note: 3月以上7年以下の拘禁刑
    statute_text: "公務所の用に供する文書又は電磁的記録を毀棄した者は、三月以上七年以下の拘禁刑に処する。"
    related_to: [damaging-private-document]

  - id: damaging-private-document
    label: 私用文書等毀棄罪
    article: "259"
    category: CrimeAgainstProperty
    legal_interest: 権利義務に関する文書・電磁的記録の効用
    elements:
      - type: object
        desc: 権利又は義務に関する他人の文書又は電磁的記録
        keywords: [契約書, 借用書, 証書]
      - type: conduct
        desc: 毀棄する
        keywords: [破る, 捨てる, 燃やす, 消去]
      - type: circumstance
        desc: 告訴がなければ公訴を提起できない（264条）
        keywords: [告訴]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
    statute_text: "権利又は義務に関する他人の文書又は電磁的記録を毀棄した者は、五年以下の拘禁刑に処する。"
    related_to: [damaging-official-document, property-damage]

  - id: damaging-building
    label: 建造物等損壊及び同致死傷罪
    article: "260"
    category: CrimeAgainstProperty
    legal_interest: 財産（建造物・艦船の効用）
    elements:
      - type: object
        desc: 他人の建造物又は艦船
        keywords: [家, 建物, 壁, 船]
      - type: conduct
        desc: 損壊する
        keywords: [壊す, 損壊, 破壊]
      - type: result
        desc: （後段・致死傷）よって人を死傷させる
        keywords: [死傷]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: （致死傷）傷害の罪と比較して、重い刑により処断する
    statute_text: "他人の建造物又は艦船を損壊した者は、五年以下の拘禁刑に処する。よって人を死傷させた者は、傷害の罪と比較して、重い刑により処断する。"
    related_to: [property-damage]

  - id: property-damage
    label: 器物損壊罪
    article: "261"
    category: CrimeAgainstProperty
    legal_interest: 財産(物の効用)
    elements:
      - type: object
        desc: 他人の物(公用・私用文書等を除く)
        keywords: [器物損壊, 壊された, 壊す, 破損, 傷つけられた, 落書き, 割られた]
      - type: conduct
        desc: 損壊又は傷害する
        keywords: [壊す, 破壊, 損壊, 傷つける, 割る]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金又は科料
    statute_text: "前三条に規定するもののほか、他人の物を損壊し、又は傷害した者は、三年以下の拘禁刑又は三十万円以下の罰金若しくは科料に処する。"

  - id: damaging-own-property
    label: 自己の物の損壊等罪
    article: "262"
    category: CrimeAgainstProperty
    legal_interest: 財産（差押え・物権・賃借権等）
    elements:
      - type: object
        desc: 自己の物で、差押えを受け、物権を負担し、賃貸し、又は配偶者居住権が設定されたもの
        keywords: [差し押さえられた物, 担保, 賃貸している物]
      - type: conduct
        desc: 損壊し、又は傷害する
        keywords: [壊す, 損壊]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 前三条の例による（文書等：259条の例で5年以下の拘禁刑）
      - type: imprisonment
        max: 5
        unit: year
        note: 前三条の例による（建造物・艦船：260条の例で5年以下の拘禁刑）
      - type: imprisonment
        max: 3
        unit: year
        note: 前三条の例による（その他の物：261条の例で3年以下の拘禁刑）
      - type: fine
        max: 300000
        unit: yen
        note: 前三条の例による（その他の物：261条の例で30万円以下の罰金若しくは科料）
    statute_text: "自己の物であっても、差押えを受け、物権を負担し、賃貸し、又は配偶者居住権が設定されたものを損壊し、又は傷害したときは、前三条の例による。"
    related_to: [damaging-private-document, damaging-building, property-damage]

  - id: boundary-damage
    label: 境界損壊罪
    article: "262の2"
    category: CrimeAgainstProperty
    legal_interest: 土地の権利関係の明確性
    elements:
      - type: object
        desc: 境界標（杭・石・ブロック等）・土地の境界
        keywords: [境界標, 境界杭, 境界]
      - type: conduct
        desc: 境界標を損壊・移動・除去し、又はその他の方法で土地の境界を認識できないようにする
        keywords: [杭を抜く, 杭を動かす, 境界を移動]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "境界標を損壊し、移動し、若しくは除去し、又はその他の方法により、土地の境界を認識することができないようにした者は、五年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [property-damage]

  - id: concealing-letters
    label: 信書隠匿罪
    article: "263"
    category: CrimeAgainstProperty
    legal_interest: 信書の効用
    elements:
      - type: object
        desc: 他人の信書
        keywords: [手紙, 郵便物, はがき]
      - type: conduct
        desc: 隠匿する
        keywords: [隠す, 渡さない]
      - type: circumstance
        desc: 告訴がなければ公訴を提起できない（264条）
        keywords: [告訴]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 6
        unit: month
        note: 6月以下の拘禁刑
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金若しくは科料
    statute_text: "他人の信書を隠匿した者は、六月以下の拘禁刑又は十万円以下の罰金若しくは科料に処する。"
    related_to: [opening-letters, property-damage]

  # --- 第12章 住居を侵す罪 (130-132) ---
  - id: breaking-into-residence
    label: 住居侵入罪
    article: "130"
    category: CrimeAgainstFreedomHonor
    legal_interest: 住居の平穏・管理権
    elements:
      - type: object
        desc: 人の住居・邸宅・建造物・艦船
        keywords: [住居侵入, 不法侵入, 侵入, 勝手に入られた, 空き巣, 侵入された]
      - type: conduct
        desc: 正当な理由なく侵入し又は要求を受けて退去しない
        keywords: [侵入, 勝手に入る, 不法侵入, 退去しない]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金
    statute_text: "正当な理由がないのに、人の住居若しくは人の看守する邸宅、建造物若しくは艦船に侵入し、又は要求を受けたにもかかわらずこれらの場所から退去しなかった者は、三年以下の拘禁刑又は十万円以下の罰金に処する。"

  # --- 第13章 秘密を侵す罪 (133-135) ---
  - id: opening-letters
    label: 信書開封罪
    article: "133"
    category: CrimeAgainstFreedomHonor
    legal_interest: 個人の秘密・通信の秘密
    elements:
      - type: object
        desc: 封をしてある他人の信書
        keywords: [信書開封, 手紙を勝手に開けられた, 郵便, 開封]
      - type: conduct
        desc: 正当な理由なく開封する
        keywords: [開封, 勝手に開ける]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑
      - type: fine
        max: 200000
        unit: yen
        note: 20万円以下の罰金
    statute_text: "正当な理由がないのに、封をしてある信書を開けた者は、一年以下の拘禁刑又は二十万円以下の罰金に処する。"

  - id: disclosure-of-secrets
    label: 秘密漏示罪
    article: "134"
    category: CrimeAgainstFreedomHonor
    legal_interest: 個人の秘密
    elements:
      - type: object
        desc: 医師・薬剤師・医薬品販売業者・助産師・弁護士・弁護人・公証人又はこれらの職にあった者（2項：宗教・祈祷・祭祀の職にある者又はあった者）
        keywords: [医師, 薬剤師, 助産師, 弁護士, 公証人, 僧侶, 牧師]
      - type: conduct
        desc: 正当な理由なく、業務上取り扱ったことについて知り得た人の秘密を漏らす
        keywords: [秘密を漏らす, 守秘義務違反, 病歴を話す]
      - type: circumstance
        desc: 告訴がなければ公訴を提起できない（135条）
        keywords: [告訴]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 6
        unit: month
        note: 6月以下の拘禁刑
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金
    statute_text: "医師、薬剤師、医薬品販売業者、助産師、弁護士、弁護人、公証人又はこれらの職にあった者が、正当な理由がないのに、その業務上取り扱ったことについて知り得た人の秘密を漏らしたときは、六月以下の拘禁刑又は十万円以下の罰金に処する。\n２　宗教、祈祷若しくは祭祀の職にある者又はこれらの職にあった者が、正当な理由がないのに、その業務上取り扱ったことについて知り得た人の秘密を漏らしたときも、前項と同様とする。"
    related_to: [opening-letters]

  # --- 第11章 往来を妨害する罪 (124-129) ---
  - id: obstruction-of-traffic
    label: 往来妨害罪
    article: "124"
    category: CrimeAgainstPublicSafety
    legal_interest: 交通の安全
    elements:
      - type: object
        desc: 陸路・水路・橋
        keywords: [往来妨害, 道路封鎖, 通行妨害, 交通妨害]
      - type: conduct
        desc: 損壊又は閉塞して往来の妨害を生じさせる
        keywords: [妨害, 封鎖, 閉塞]
      - type: result
        desc: （2項・往来妨害致死傷）よって人を死傷させる
        keywords: [死傷]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 2
        unit: year
        note: 2年以下の拘禁刑
      - type: fine
        max: 200000
        unit: yen
        note: 20万円以下の罰金
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: （2項）傷害の罪と比較して、重い刑により処断する
    statute_text: "陸路、水路又は橋を損壊し、又は閉塞して往来の妨害を生じさせた者は、二年以下の拘禁刑又は二十万円以下の罰金に処する。\n２　前項の罪を犯し、よって人を死傷させた者は、傷害の罪と比較して、重い刑により処断する。"

  - id: endangering-traffic
    label: 往来危険罪
    article: "125"
    category: CrimeAgainstPublicSafety
    legal_interest: 交通の安全
    elements:
      - type: object
        desc: 鉄道・その標識（2項：灯台・浮標）
        keywords: [線路, 鉄道, 踏切, 信号, 灯台]
      - type: conduct
        desc: 損壊し、又はその他の方法により汽車・電車（2項：艦船）の往来の危険を生じさせる
        keywords: [置き石, 線路に石, 線路に置, 往来の危険]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 2
        max: null
        unit: year
        note: 2年以上の有期拘禁刑
    statute_text: "鉄道若しくはその標識を損壊し、又はその他の方法により、汽車又は電車の往来の危険を生じさせた者は、二年以上の有期拘禁刑に処する。\n２　灯台若しくは浮標を損壊し、又はその他の方法により、艦船の往来の危険を生じさせた者も、前項と同様とする。"
    related_to: [obstruction-of-traffic]

  - id: overturning-train
    label: 汽車転覆等罪
    article: "126"
    category: CrimeAgainstPublicSafety
    legal_interest: 交通の安全・乗客の生命身体
    elements:
      - type: object
        desc: 現に人がいる汽車・電車（2項：艦船）
        keywords: [電車, 列車, 船]
      - type: conduct
        desc: 転覆させ、沈没させ、又は破壊する
        keywords: [転覆, 脱線, 沈没, 破壊]
      - type: result
        desc: （3項・汽車転覆等致死）よって人を死亡させる
        keywords: [死亡]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: null
        unit: year
        note: 無期又は3年以上の拘禁刑
      - type: death
        note: （3項・致死）死刑又は無期拘禁刑
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: （3項・致死）死刑又は無期拘禁刑
    statute_text: "現に人がいる汽車又は電車を転覆させ、又は破壊した者は、無期又は三年以上の拘禁刑に処する。\n２　現に人がいる艦船を転覆させ、沈没させ、又は破壊した者も、前項と同様とする。\n３　前二項の罪を犯し、よって人を死亡させた者は、死刑又は無期拘禁刑に処する。"

  - id: overturning-train-by-endangering
    label: 往来危険による汽車転覆等罪
    article: "127"
    category: CrimeAgainstPublicSafety
    legal_interest: 交通の安全・乗客の生命身体
    elements:
      - type: conduct
        desc: 往来危険（125条）の罪を犯す
        keywords: [置き石, 往来の危険]
      - type: result
        desc: よって汽車・電車を転覆・破壊し、又は艦船を転覆・沈没・破壊する
        keywords: [転覆, 脱線, 沈没]
      - type: intent
        desc: 基本犯の故意（転覆等の結果の故意は不要）
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: null
        unit: year
        note: 前条の例による（無期又は3年以上の拘禁刑）
      - type: death
        note: 前条の例による（人を死亡させたとき：死刑又は無期拘禁刑）
    statute_text: "第百二十五条の罪を犯し、よって汽車若しくは電車を転覆させ、若しくは破壊し、又は艦船を転覆させ、沈没させ、若しくは破壊した者も、前条の例による。"
    related_to: [endangering-traffic, overturning-train]

  - id: negligent-endangering-traffic
    label: 過失往来危険罪
    article: "129"
    category: CrimeAgainstPublicSafety
    legal_interest: 交通の安全
    elements:
      - type: conduct
        desc: 過失により汽車・電車・艦船の往来の危険を生じさせ、又は転覆・沈没・破壊させる
        keywords: [往来の危険, 転覆, 脱線]
      - type: circumstance
        desc: （2項・業務上過失往来危険）その業務に従事する者
        keywords: [運転士, 船長, 業務上]
      - type: intent
        desc: 過失
        keywords: []
    penalties:
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金（1項）
      - type: imprisonment
        max: 3
        unit: year
        note: （2項・業務上）3年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: （2項・業務上）50万円以下の罰金
    statute_text: "過失により、汽車、電車若しくは艦船の往来の危険を生じさせ、又は汽車若しくは電車を転覆させ、若しくは破壊し、若しくは艦船を転覆させ、沈没させ、若しくは破壊した者は、三十万円以下の罰金に処する。\n２　その業務に従事する者が前項の罪を犯したときは、三年以下の拘禁刑又は五十万円以下の罰金に処する。"
    related_to: [endangering-traffic, overturning-train]
