    statute_text: "失火により、第百八条に規定する物又は他人の所有に係る第百九条に規定する物を焼損した者は、五十万円以下の罰金に処する。\n２　失火により、第百九条に規定する物であって自己の所有に係るもの又は第百十条に規定する物を焼損し、よって公共の危険を生じさせた者も、前項と同様とする。"

