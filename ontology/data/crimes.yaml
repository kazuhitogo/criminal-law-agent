    statute_text: "医師が、公務所に提出すべき診断書、検案書若しくは死亡証書に虚偽の記載をし、又は公務所に提出すべき電磁的記録文書等であって、診断書、検案書若しくは死亡証書の全部若しくは一部として用いられるものに虚偽の記録をしたときは、三年以下の拘禁刑又は三十万円以下の罰金に処する。"

