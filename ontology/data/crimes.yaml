# 刑法第2編「罪」(77条〜264条) データ
# 法定刑は拘禁刑への一本化(2025年6月施行)を反映。
# statute_text は e-Gov 法令データ(刑法, 明治40年法律第45号)の条文に基づく。
# category は schema.ttl の罪カテゴリクラス名と一致させる。

crimes:
  # ================================================================
  # 【国家的法益に対する罪】
  # ================================================================

  # --- 第1章 内乱に関する罪 (77-80) ---
  - id: insurrection
    label: 内乱罪
    article: "77"
    category: CrimeAgainstStateExistence
    legal_interest: 国家の存立・統治機構
    elements:
      - type: conduct
        desc: 国の統治機構を破壊し又は領土で国権を排除して権力を行使する等を目的とした暴動
        keywords: [内乱, 暴動, クーデター, 政府転覆, 反乱]
      - type: intent
        desc: 国憲紊乱の目的
        keywords: []
    penalties:
      - type: death
        note: 首謀者は死刑又は無期拘禁刑
      - type: imprisonment
        min: null
        max: null
        unit: year
        note: 死刑又は無期拘禁刑(首謀者)。その他は役割に応じ無期又は有期拘禁刑
    statute_text: "国の統治機構を破壊し、又はその領土において国権を排除して権力を行使し、その他憲法の定める統治の基本秩序を壊乱することを目的として暴動をした者は、内乱の罪とし、次の区別に従って処断する。"

  # --- 第2章 外患に関する罪 (81-89) ---
  - id: inducement-foreign-aggression
    label: 外患誘致罪
    article: "81"
    category: CrimeAgainstStateExistence
    legal_interest: 国家の対外的存立
    elements:
      - type: conduct
        desc: 外国と通謀して日本国に武力を行使させる
        keywords: [外患, 外国と通謀, 武力行使, 売国]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: death
        note: 死刑
    statute_text: "外国と通謀して日本国に対し武力を行使させた者は、死刑に処する。"

  # --- 第5章 公務の執行を妨害する罪 (95-96の6) ---
  - id: obstruction-of-official-duty
    label: 公務執行妨害罪
    article: "95"
    category: CrimeAgainstStateFunction
    legal_interest: 国家・地方公共団体の公務
    elements:
      - type: object
        desc: 職務を執行する公務員
        keywords: [警察官, 公務員, 職員, 役所]
      - type: conduct
        desc: 職務執行に際し暴行又は脅迫を加える
        keywords: [暴行, 脅迫, 抵抗, 妨害, 殴る, 突き飛ばす]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金
    statute_text: "公務員が職務を執行するに当たり、これに対して暴行又は脅迫を加えた者は、三年以下の拘禁刑又は五十万円以下の罰金に処する。"

  # --- 第6章 逃走の罪 (97-102) ---
  - id: escape
    label: 逃走罪
    article: "97"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の拘禁作用
    elements:
      - type: object
        desc: 法令により拘禁された者
        keywords: [逃走, 脱走, 脱獄, 逃げる]
      - type: conduct
        desc: 逃走する
        keywords: [逃走, 逃亡]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
    statute_text: "法令により拘禁された者が逃走したときは、三年以下の拘禁刑に処する。"

  # --- 第7章 犯人蔵匿及び証拠隠滅の罪 (103-105の2) ---
  - id: harboring-criminal
    label: 犯人蔵匿罪
    article: "103"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の刑事司法作用
    elements:
      - type: object
        desc: 罰金以上の刑に当たる罪を犯した者又は拘禁中に逃走した者
        keywords: [犯人, かくまう, 匿う, 逃がす]
      - type: conduct
        desc: 蔵匿し又は隠避させる
        keywords: [かくまう, 匿う, 隠す, 逃がす]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金
    statute_text: "罰金以上の刑に当たる罪を犯した者又は拘禁中に逃走した者を蔵匿し、又は隠避させた者は、三年以下の拘禁刑又は三十万円以下の罰金に処する。"

  - id: evidence-destruction
    label: 証拠隠滅罪
    article: "104"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の刑事司法作用
    elements:
      - type: object
        desc: 他人の刑事事件に関する証拠
        keywords: [証拠, 隠滅, 偽造, 変造, 隠す, 捨てる]
      - type: conduct
        desc: 隠滅・偽造・変造し又はこれを使用する
        keywords: [隠滅, 証拠隠滅, 偽造, 変造]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金
    statute_text: "他人の刑事事件に関する証拠を隠滅し、偽造し、若しくは変造し、又は偽造若しくは変造の証拠を使用した者は、三年以下の拘禁刑又は三十万円以下の罰金に処する。"

  # --- 第9章 騒乱の罪 (106-107) ---
  - id: riot
    label: 騒乱罪
    article: "106"
    category: CrimeAgainstPublicSafety
    legal_interest: 公共の平穏
    elements:
      - type: conduct
        desc: 多衆で集合して暴行又は脅迫をする
        keywords: [騒乱, 暴動, 多衆, 集団, 暴れる]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: null
        unit: year
        note: 首謀者は1年以上10年以下の拘禁刑等、役割により区別
    statute_text: "多衆で集合して暴行又は脅迫をした者は、騒乱の罪とし、次の区別に従って処断する。"

  # --- 第11章 放火及び失火の罪 (108-118) ---
  - id: arson-inhabited
    label: 現住建造物等放火罪
    article: "108"
    category: CrimeAgainstPublicSafety
    legal_interest: 公共の安全(不特定多数の生命身体財産)
    elements:
      - type: object
        desc: 現に人が住居に使用し又は現に人がいる建造物等
        keywords: [放火, 火をつける, 燃やす, 家, 建物]
      - type: conduct
        desc: 放火して焼損する
        keywords: [放火, 火災, 燃やす, 火をつける]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: death
        note: 死刑又は無期若しくは5年以上の拘禁刑
      - type: imprisonment
        min: 5
        max: null
        unit: year
        note: 死刑又は無期若しくは5年以上の拘禁刑
    statute_text: "放火して、現に人が住居に使用し又は現に人がいる建造物、汽車、電車、艦船又は鉱坑を焼損した者は、死刑又は無期若しくは五年以上の拘禁刑に処する。"

  # --- 第15章 飲料水に関する罪 (142-147) ---
  - id: water-contamination
    label: 浄水汚染罪
    article: "142"
    category: CrimeAgainstPublicMorals
    legal_interest: 公衆の健康
    elements:
      - type: object
        desc: 人の飲料に供する浄水
        keywords: [飲料水, 水道, 汚染, 毒, 混入]
      - type: conduct
        desc: 汚染して使用できないようにする
        keywords: [汚染, 混入, 毒, 汚す]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 6
        unit: month
        note: 6月以下の拘禁刑
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金
    statute_text: "人の飲料に供する浄水を汚染し、よって使用することができないようにした者は、六月以下の拘禁刑又は十万円以下の罰金に処する。"

  # --- 第16章 通貨偽造の罪 (148-153) ---
  - id: counterfeiting-currency
    label: 通貨偽造罪
    article: "148"
    category: CrimeAgainstPublicTrust
    legal_interest: 通貨に対する公共の信用
    elements:
      - type: object
        desc: 行使の目的で通用する貨幣・紙幣・銀行券
        keywords: [偽札, 偽造, 通貨, お金, 紙幣, 貨幣]
      - type: conduct
        desc: 偽造又は変造する
        keywords: [偽造, 変造, 偽札]
      - type: intent
        desc: 行使の目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: null
        unit: year
        note: 無期又は3年以上の拘禁刑
    statute_text: "行使の目的で、通用する貨幣、紙幣又は銀行券を偽造し、又は変造した者は、無期又は三年以上の拘禁刑に処する。"

  # --- 第17章 文書偽造の罪 (154-161の2) ---
  - id: counterfeiting-private-document
    label: 私文書偽造罪
    article: "159"
    category: CrimeAgainstPublicTrust
    legal_interest: 文書に対する公共の信用
    elements:
      - type: object
        desc: 権利義務又は事実証明に関する他人の文書・図画
        keywords: [文書偽造, 偽造, 書類, 契約書, サイン, 署名, 印鑑]
      - type: conduct
        desc: 他人の印章・署名を使用して偽造する
        keywords: [偽造, 変造, なりすまし, 偽の書類]
      - type: intent
        desc: 行使の目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: 3月以上5年以下の拘禁刑
    statute_text: "行使の目的で、他人の印章若しくは署名を使用して権利、義務若しくは事実証明に関する文書若しくは図画を偽造し、又は偽造した他人の印章若しくは署名を使用して権利、義務若しくは事実証明に関する文書若しくは図画を偽造した者は、三月以上五年以下の拘禁刑に処する。"

  # --- 第18章 有価証券偽造の罪 (162-163) ---
  - id: counterfeiting-securities
    label: 有価証券偽造罪
    article: "162"
    category: CrimeAgainstPublicTrust
    legal_interest: 有価証券に対する公共の信用
    elements:
      - type: object
        desc: 公債証書・官庁の証券・会社の株券その他の有価証券
        keywords: [有価証券, 株券, 手形, 小切手, 偽造]
      - type: conduct
        desc: 偽造又は変造する
        keywords: [偽造, 変造]
      - type: intent
        desc: 行使の目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 120
        unit: month
        note: 3月以上10年以下の拘禁刑
    statute_text: "行使の目的で、公債証書、官庁の証券、会社の株券その他の有価証券を偽造し、又は変造した者は、三月以上十年以下の拘禁刑に処する。"

  # --- 第18章の2 支払用カード電磁的記録に関する罪 (163の2-163の5) ---
  - id: unauthorized-payment-card-record
    label: 支払用カード電磁的記録不正作出罪
    article: "163の2"
    category: CrimeAgainstPublicTrust
    legal_interest: 支払用カードの電磁的記録に対する信用
    elements:
      - type: object
        desc: 人の財産上の事務処理を誤らせる目的のクレジットカード等の電磁的記録
        keywords: [クレジットカード, スキミング, 電磁的記録, カード偽造, 不正作出]
      - type: conduct
        desc: 不正に作出する
        keywords: [偽造, スキミング, 不正作出]
      - type: intent
        desc: 財産上の事務処理を誤らせる目的
        keywords: []
    penalties:
      - type: imprisonment
        max: 10
        unit: year
        note: 10年以下の拘禁刑
      - type: fine
        max: 1000000
        unit: yen
        note: 100万円以下の罰金
    statute_text: "人の財産上の事務処理を誤らせる目的で、その事務処理の用に供する電磁的記録であって、クレジットカードその他の代金又は料金の支払用のカードを構成するものを不正に作った者は、十年以下の拘禁刑又は百万円以下の罰金に処する。"

  # --- 第19章 印章偽造の罪 (164-168) ---
  - id: counterfeiting-seal
    label: 印章偽造罪
    article: "167"
    category: CrimeAgainstPublicTrust
    legal_interest: 印章・署名に対する公共の信用
    elements:
      - type: object
        desc: 他人の印章又は署名
        keywords: [印鑑, 印章, 署名, ハンコ, 偽造]
      - type: conduct
        desc: 行使の目的で偽造する
        keywords: [偽造, 印鑑偽造]
      - type: intent
        desc: 行使の目的
        keywords: []
    penalties:
      - type: imprisonment
        max: 3
        unit: year
        note: 3年以下の拘禁刑
    statute_text: "行使の目的で、他人の印章又は署名を偽造した者は、三年以下の拘禁刑に処する。"

  # --- 第20章 偽証の罪 (169-171) ---
  - id: perjury
    label: 偽証罪
    article: "169"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の審判作用
    elements:
      - type: object
        desc: 法律により宣誓した証人
        keywords: [偽証, 嘘の証言, 証人, 裁判, 宣誓]
      - type: conduct
        desc: 虚偽の陳述をする
        keywords: [虚偽, 嘘, 偽証]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 120
        unit: month
        note: 3月以上10年以下の拘禁刑
    statute_text: "法律により宣誓した証人が虚偽の陳述をしたときは、三月以上十年以下の拘禁刑に処する。"

  # --- 第21章 虚偽告訴の罪 (172-173) ---
  - id: false-accusation
    label: 虚偽告訴罪
    article: "172"
    category: CrimeAgainstStateFunction
    legal_interest: 国家の審判作用・個人の私生活の平穏
    elements:
      - type: conduct
        desc: 人に刑事・懲戒処分を受けさせる目的で虚偽の告訴・告発をする
        keywords: [虚偽告訴, でっちあげ, 冤罪, 嘘の告訴, 誣告]
      - type: intent
        desc: 刑事又は懲戒の処分を受けさせる目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 120
        unit: month
        note: 3月以上10年以下の拘禁刑
    statute_text: "人に刑事又は懲戒の処分を受けさせる目的で、虚偽の告訴、告発その他の申告をした者は、三月以上十年以下の拘禁刑に処する。"

  # --- 第22章 わいせつ、不同意性交等及び重婚の罪 (174-184) ---
  - id: public-indecency
    label: 公然わいせつ罪
    article: "174"
    category: CrimeAgainstPublicMorals
    legal_interest: 健全な性風俗
    elements:
      - type: conduct
        desc: 公然とわいせつな行為をする
        keywords: [公然わいせつ, 露出, わいせつ行為]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 6
        unit: month
        note: 6月以下の拘禁刑
      - type: fine
        max: 300000
        unit: yen
        note: 30万円以下の罰金又は科料
    statute_text: "公然とわいせつな行為をした者は、六月以下の拘禁刑若しくは三十万円以下の罰金又は拘留若しくは科料に処する。"

  - id: non-consensual-sexual-intercourse
    label: 不同意性交等罪
    article: "177"
    category: CrimeAgainstFreedomHonor
    legal_interest: 性的自由・性的自己決定権
    elements:
      - type: object
        desc: 同意しない意思を形成等が困難な状態の相手
        keywords: [性的暴行, 不同意性交, レイプ, 性被害, 無理やり]
      - type: conduct
        desc: 暴行・脅迫等により同意しない意思の形成等を困難にして性交等をする
        keywords: [無理やり, 同意なく, 性交, 性的暴行]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 5
        max: null
        unit: year
        note: 5年以上の有期拘禁刑
    statute_text: "次に掲げる行為又は事由その他これらに類する行為又は事由により、同意しない意思を形成し、表明し若しくは全うすることが困難な状態にさせ又はその状態にあることに乗じて、性交、肛門性交、口腔性交又は膣若しくは肛門に身体の一部若しくは物を挿入する行為であってわいせつなものをした者は、婚姻関係の有無にかかわらず、五年以上の有期拘禁刑に処する。"

  - id: non-consensual-indecency
    label: 不同意わいせつ罪
    article: "176"
    category: CrimeAgainstFreedomHonor
    legal_interest: 性的自由・性的自己決定権
    elements:
      - type: conduct
        desc: 同意しない意思の形成等が困難な状態でわいせつな行為をする
        keywords: [痴漢, わいせつ, 体を触られた, 無理やり触られた, 性被害]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 6
        max: 120
        unit: month
        note: 6月以上10年以下の拘禁刑
    statute_text: "前条第一項各号に掲げる行為又は事由その他これらに類する行為又は事由により、同意しない意思を形成し、表明し若しくは全うすることが困難な状態にさせ又はその状態にあることに乗じて、わいせつな行為をした者は、婚姻関係の有無にかかわらず、六月以上十年以下の拘禁刑に処する。"

  - id: gambling
    label: 賭博罪
    article: "185"
    category: CrimeAgainstPublicMorals
    legal_interest: 健全な経済的風俗
    elements:
      - type: conduct
        desc: 賭博をする
        keywords: [賭博, ギャンブル, 賭け, 違法カジノ, 賭け事]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金又は科料
    statute_text: "賭博をした者は、五十万円以下の罰金又は科料に処する。ただし、一時の娯楽に供する物を賭けたにとどまるときは、この限りでない。"

  # --- 第24章 礼拝所及び墳墓に関する罪 (188-192) ---
  - id: disrespect-worship-place
    label: 礼拝所不敬罪
    article: "188"
    category: CrimeAgainstPublicMorals
    legal_interest: 国民の宗教的感情
    elements:
      - type: object
        desc: 神祠・仏堂・墓所その他の礼拝所
        keywords: [神社, 墓, 礼拝所, 仏堂, 不敬, 損壊]
      - type: conduct
        desc: 公然と不敬な行為をする
        keywords: [不敬, 荒らす, 汚す]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 6
        unit: month
        note: 6月以下の拘禁刑
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金又は科料
    statute_text: "神祠、仏堂、墓所その他の礼拝所に対し、公然と不敬な行為をした者は、六月以下の拘禁刑又は十万円以下の罰金に処する。"

