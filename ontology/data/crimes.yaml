        max: null
        unit: year
        note: 偽造等をした者と同一の刑（詔書等：無期又は3年以上の拘禁刑）
      - type: imprisonment
        min: 1
        max: 10
        unit: year
        note: 偽造等をした者と同一の刑（有印公文書：1年以上10年以下の拘禁刑）
      - type: imprisonment
        max: 5
        unit: year
        note: 偽造等をした者と同一の刑（公正証書原本不実記載等：5年以下の拘禁刑又は50万円以下の罰金。無印公文書は3年以下の拘禁刑又は20万円以下の罰金。免状等は1年以下の拘禁刑又は20万円以下の罰金）
      - type: fine
        max: 500000
        unit: yen
        note: 偽造等をした者と同一の刑（公正証書原本不実記載等：50万円以下の罰金）
    statute_text: "第百五十四条から前条までの文書等若しくは電磁的記録文書等を行使し、同条第一項の電磁的記録を公正証書の原本としての用に供し、又は同条第二項の電磁的記録を人の事務処理の用に供した者は、その文書等若しくは電磁的記録文書等を偽造し、若しくは変造し、虚偽の文書等若しくは電磁的記録文書等を作成し、又は不実の記載若しくは記録をさせた者と同一の刑に処する。\n２　前項の罪の未遂は、罰する。"
    related_to: [counterfeiting-imperial-document, counterfeiting-official-document, false-official-document, false-entry-in-notarial-deed]
  - id: counterfeiting-private-document
