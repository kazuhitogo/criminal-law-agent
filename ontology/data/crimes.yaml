    legal_interest: 文書に対する公共の信用
    elements:
      - type: object
        desc: 登記簿・戸籍簿その他の権利義務に関する公正証書の原本（電磁的記録を含む）
        keywords: [登記簿, 戸籍, 住民登録, 登記]
      - type: conduct
        desc: 公務員に虚偽の申立てをして不実の記載・記録をさせる
        keywords: [虚偽の申立て, 嘘の届出, 偽装結婚, 嘘の住所, 虚偽の登記]
      - type: object
        desc: （2項）免状・鑑札・旅券（電磁的記録を含む）
        keywords: [旅券, パスポート, 免許, 免状]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        max: 5
        unit: year
        note: 5年以下の拘禁刑（1項）
      - type: fine
        max: 500000
        unit: yen
        note: 50万円以下の罰金（1項）
      - type: imprisonment
        max: 1
        unit: year
        note: （2項）1年以下の拘禁刑
      - type: fine
        max: 200000
        unit: yen
        note: （2項）20万円以下の罰金
    statute_text: "公務員に対し虚偽の申立てをして、登記簿、戸籍簿その他の権利若しくは義務に関する公正証書の原本に不実の記載をさせ、又は権利若しくは義務に関する公正証書の原本として用いられる電磁的記録に不実の記録をさせた者は、五年以下の拘禁刑又は五十万円以下の罰金に処する。\n２　公務員に対し虚偽の申立てをして、免状、鑑札若しくは旅券に不実の記載をさせ、又は電磁的記録文書等その他の電磁的記録であって、免状、鑑札若しくは旅券の全部若しくは一部として用いられるものに不実の記録をさせた者は、一年以下の拘禁刑又は二十万円以下の罰金に処する。\n３　前二項の罪の未遂は、罰する。"

  - id: uttering-forged-official-document
