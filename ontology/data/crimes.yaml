    statute_text: "わいせつの目的で、十六歳未満の者に対し、次の各号に掲げるいずれかの行為をした者（当該十六歳未満の者が十三歳以上である場合については、その者が生まれた日より五年以上前の日に生まれた者に限る。）は、一年以下の拘禁刑又は五十万円以下の罰金に処する。\n一　威迫し、偽計を用い又は誘惑して面会を要求すること。\n二　拒まれたにもかかわらず、反復して面会を要求すること。\n三　金銭その他の利益を供与し、又はその申込み若しくは約束をして面会を要求すること。\n２　前項の罪を犯し、よってわいせつの目的で当該十六歳未満の者と面会をした者は、二年以下の拘禁刑又は百万円以下の罰金に処する。\n３　十六歳未満の者に対し、次の各号に掲げるいずれかの行為（第二号に掲げる行為については、当該行為をさせることがわいせつなものであるものに限る。）を要求した者（当該十六歳未満の者が十三歳以上である場合については、その者が生まれた日より五年以上前の日に生まれた者に限る。）は、一年以下の拘禁刑又は五十万円以下の罰金に処する。\n一　性交、肛門性交又は口腔性交をする姿態をとってその映像を送信すること。\n二　前号に掲げるもののほか、膣又は肛門に身体の一部（陰茎を除く。）又は物を挿入し又は挿入される姿態、性的な部位（性器若しくは肛門若しくはこれらの周辺部、臀部又は胸部をいう。以下この号において同じ。）を触り又は触られる姿態、性的な部位を露出した姿態その他の姿態をとってその映像を送信すること。"
    related_to: [non-consensual-indecency, non-consensual-sexual-intercourse]

