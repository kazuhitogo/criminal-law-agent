        keywords: [無理やり, 同意なく, 性交, 性的暴行]
      - type: conduct
        desc: （2項）わいせつでないとの誤信・人違いをさせ、又はそれに乗じて性交等をする
        keywords: [だまして, 人違い]
      - type: object
        desc: （3項）16歳未満の者（13歳以上16歳未満の場合は5歳以上年長の者による行為に限る）
        keywords: [16歳未満, 子ども, 未成年]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 5
        max: null
        unit: year
        note: 5年以上の有期拘禁刑
    statute_text: "前条第一項各号に掲げる行為又は事由その他これらに類する行為又は事由により、同意しない意思を形成し、表明し若しくは全うすることが困難な状態にさせ又はその状態にあることに乗じて、性交、肛門性交、口腔性交又は膣若しくは肛門に身体の一部（陰茎を除く。）若しくは物を挿入する行為であってわいせつなもの（以下この条及び第百七十九条第二項において「性交等」という。）をした者は、婚姻関係の有無にかかわらず、五年以上の有期拘禁刑に処する。\n２　行為がわいせつなものではないとの誤信をさせ、若しくは行為をする者について人違いをさせ、又はそれらの誤信若しくは人違いをしていることに乗じて、性交等をした者も、前項と同様とする。\n３　十六歳未満の者に対し、性交等をした者（当該十六歳未満の者が十三歳以上である場合については、その者が生まれた日より五年以上前の日に生まれた者に限る。）も、第一項と同様とする。"

  - id: non-consensual-indecency
    label: 不同意わいせつ罪
    article: "176"
    category: CrimeAgainstFreedomHonor
    legal_interest: 性的自由・性的自己決定権
    elements:
      - type: conduct
        desc: 同意しない意思の形成等が困難な状態でわいせつな行為をする
        keywords: [痴漢, わいせつ, 体を触られた, 無理やり触られた, 性被害]
      - type: conduct
        desc: （2項）わいせつでないとの誤信・人違いをさせ、又はそれに乗じてわいせつな行為をする
        keywords: [だまして, 人違い]
      - type: object
        desc: （3項）16歳未満の者（13歳以上16歳未満の場合は5歳以上年長の者による行為に限る）
        keywords: [16歳未満, 子ども, 未成年]
      - type: intent
        desc: 故意
        keywords: []
    penalties:
      - type: imprisonment
        min: 6
        max: 120
        unit: month
        note: 6月以上10年以下の拘禁刑
    statute_text: "次に掲げる行為又は事由その他これらに類する行為又は事由により、同意しない意思を形成し、表明し若しくは全うすることが困難な状態にさせ又はその状態にあることに乗じて、わいせつな行為をした者は、婚姻関係の有無にかかわらず、六月以上十年以下の拘禁刑に処する。\n一　暴行若しくは脅迫を用いること又はそれらを受けたこと。\n二　心身の障害を生じさせること又はそれがあること。\n三　アルコール若しくは薬物を摂取させること又はそれらの影響があること。\n四　睡眠その他の意識が明瞭でない状態にさせること又はその状態にあること。\n五　同意しない意思を形成し、表明し又は全うするいとまがないこと。\n六　予想と異なる事態に直面させて恐怖させ、若しくは驚愕させること又はその事態に直面して恐怖し、若しくは驚愕していること。\n七　虐待に起因する心理的反応を生じさせること又はそれがあること。\n八　経済的又は社会的関係上の地位に基づく影響力によって受ける不利益を憂慮させること又はそれを憂慮していること。\n２　行為がわいせつなものではないとの誤信をさせ、若しくは行為をする者について人違いをさせ、又はそれらの誤信若しくは人違いをしていることに乗じて、わいせつな行為をした者も、前項と同様とする。\n３　十六歳未満の者に対し、わいせつな行為をした者（当該十六歳未満の者が十三歳以上である場合については、その者が生まれた日より五年以上前の日に生まれた者に限る。）も、第一項と同様とする。"

