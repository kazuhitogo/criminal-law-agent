    statute_text: "第百十六条又は前条第一項の行為が業務上必要な注意を怠ったことによるとき、又は重大な過失によるときは、三年以下の拘禁刑又は百五十万円以下の罰金に処する。"
    related_to: [negligent-fire, explosion]

  - id: gas-leakage
