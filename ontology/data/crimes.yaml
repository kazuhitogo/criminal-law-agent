      - type: conduct
        desc: 破裂させて108条の物又は他人所有の109条の物を損壊する（自己所有の109条の物・110条の物は公共の危険を生じさせた場合）
        keywords: [爆発, 破裂, 爆破]
      - type: intent
        desc: 故意（2項は過失）
        keywords: []
    penalties:
      - type: death
        note: 放火の例による（108条の物：死刑又は無期若しくは5年以上の拘禁刑）
      - type: imprisonment
        min: 5
        max: null
        unit: year
        note: 放火の例による（108条の物：死刑又は無期若しくは5年以上の拘禁刑）
      - type: imprisonment
        min: 2
        max: null
        unit: year
        note: 放火の例による（他人所有の109条の物：2年以上の有期拘禁刑。自己所有の109条の物・110条の物は109条2項・110条の例）
      - type: fine
        max: 500000
        unit: yen
        note: （2項・過失）失火の例による（50万円以下の罰金）
    statute_text: "火薬、ボイラーその他の激発すべき物を破裂させて、第百八条に規定する物又は他人の所有に係る第百九条に規定する物を損壊した者は、放火の例による。第百九条に規定する物であって自己の所有に係るもの又は第百十条に規定する物を損壊し、よって公共の危険を生じさせた者も、同様とする。\n２　前項の行為が過失によるときは、失火の例による。"
    related_to: [arson-inhabited, arson-uninhabited, arson-other-property, negligent-fire]

