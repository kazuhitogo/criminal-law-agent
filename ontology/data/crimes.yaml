      - type: conduct
        desc: （2項）他人が押印・署名した文書等又は電磁的記録文書等を変造する
        keywords: [変造, 改ざん]
      - type: conduct
        desc: （3項）前二項以外の権利義務又は事実証明に関する文書等・電磁的記録文書等を偽造・変造する（無印私文書偽造等）
        keywords: [偽造, 変造]
      - type: intent
        desc: 行使の目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: 3月以上5年以下の拘禁刑（1項・2項）
      - type: imprisonment
        max: 1
        unit: year
        note: 1年以下の拘禁刑（3項）
      - type: fine
        max: 100000
        unit: yen
        note: 10万円以下の罰金（3項）
    statute_text: "行使の目的で、次の各号に掲げるいずれかの行為をした者は、三月以上五年以下の拘禁刑に処する。\n一　他人の印章等を使用して権利、義務若しくは事実証明に関する文書等を偽造し、又は偽造した他人の印章等を使用して権利、義務若しくは事実証明に関する文書等を偽造する行為\n二　他人の電磁的記録印章等を使用して権利、義務若しくは事実証明に関する電磁的記録文書等を偽造し、又は偽造した他人の電磁的記録印章等を使用して権利、義務若しくは事実証明に関する電磁的記録文書等を偽造する行為\n２　他人が押印し若しくは署名した権利、義務若しくは事実証明に関する文書等又は他人が電磁的記録印章等を使用して作成した権利、義務若しくは事実証明に関する電磁的記録文書等を変造した者も、前項と同様とする。\n３　前二項に規定するもののほか、権利、義務又は事実証明に関する文書等又は電磁的記録文書等を偽造し、又は変造した者は、一年以下の拘禁刑又は十万円以下の罰金に処する。"

  - id: false-medical-certificate
