        keywords: [偽造, スキミング, 不正作出]
      - type: conduct
        desc: （2項）不正に作られた電磁的記録を人の財産上の事務処理の用に供する
        keywords: [偽造カードを使う, 不正使用]
      - type: conduct
        desc: （3項）不正に作られた電磁的記録を構成部分とするカードを譲り渡し・貸し渡し・輸入する
