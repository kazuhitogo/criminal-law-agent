        keywords: [偽造の契約書, 偽の書類, 嘘の診断書]
      - type: conduct
        desc: 行使する
        keywords: [行使, 提出, 使った, 見せた]
      - type: intent
        desc: 偽造等であることの認識
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: 60
        unit: month
        note: 偽造等をした者と同一の刑（有印私文書：3月以上5年以下の拘禁刑）
      - type: imprisonment
