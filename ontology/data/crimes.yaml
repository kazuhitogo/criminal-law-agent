    category: CrimeAgainstPublicTrust
    legal_interest: 文書に対する公共の信用
    elements:
      - type: circumstance
        desc: 行為者が公務員で、その職務に関すること
        keywords: [公務員, 役所の職員]
      - type: conduct
        desc: 虚偽の文書等・電磁的記録文書等を作成し、又は変造する
        keywords: [虚偽の公文書, 嘘の証明書, 改ざん]
      - type: intent
        desc: 行使の目的
        keywords: []
    penalties:
      - type: imprisonment
        min: 3
        max: null
        unit: year
        note: 前二条の例による（詔書等：無期又は3年以上の拘禁刑）
      - type: imprisonment
        min: 1
        max: 10
        unit: year
        note: 前二条の例による（有印：1年以上10年以下の拘禁刑）
      - type: imprisonment
        max: 3
        unit: year
        note: 前二条の例による（無印：3年以下の拘禁刑）
      - type: fine
        max: 200000
        unit: yen
        note: 前二条の例による（無印：20万円以下の罰金）
    statute_text: "公務員が、その職務に関し、行使の目的で、虚偽の文書等若しくは電磁的記録文書等を作成し、又は文書等若しくは電磁的記録文書等を変造したときは、印章等又は電磁的記録印章等の有無により区別して、前二条の例による。"
    related_to: [counterfeiting-imperial-document, counterfeiting-official-document]

  - id: false-entry-in-notarial-deed
