<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 天秤（正義の秤） -->
  <g stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 支柱 -->
    <line x1="32" y1="13" x2="32" y2="48"/>
    <!-- 梁 -->
    <line x1="14" y1="20" x2="50" y2="20"/>
    <!-- 頂点の飾り -->
    <circle cx="32" cy="13" r="2.6" fill="url(#gold)" stroke="none"/>
    <!-- 吊り紐 左 -->
    <line x1="14" y1="20" x2="9" y2="31"/>
    <line x1="14" y1="20" x2="19" y2="31"/>
    <!-- 吊り紐 右 -->
    <line x1="50" y1="20" x2="45" y2="31"/>
    <line x1="50" y1="20" x2="55" y2="31"/>
    <!-- 皿 左 -->
    <path d="M7 31 Q14 40 21 31"/>
    <!-- 皿 右 -->
    <path d="M43 31 Q50 40 57 31"/>
    <!-- 台座 -->
    <line x1="22" y1="48" x2="42" y2="48"/>
    <path d="M26 48 Q32 42 38 48"/>
  </g>
</svg>
